<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #0D121F;
      --card-bg: #151D30;
      --accent-color: #8B5CF6;
      --accent-hover: #7C3AED;
      --text-color: #F3F4F6;
      --text-muted: #9CA3AF;
      --border-color: rgba(139, 92, 246, 0.2);
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #8B5CF6, #3B82F6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(to right, #C084FC, #60A5FA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background-color: rgba(139, 92, 246, 0.1);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #EF4444;
    }

    .dot.online {
      background-color: #10B981;
      box-shadow: 0 0 8px #10B981;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <h1 class="title">EasyData MCP Connector</h1>
  </div>

  <div class="card">
    <p class="card-title font-semibold">Open AI Workspace</p>
    <div class="btn-group">
      <a href="https://gemini.google.com" target="_blank" class="btn">
        Launch Gemini
      </a>
      <a href="https://claude.ai" target="_blank" class="btn btn-secondary">
        Launch Claude
      </a>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span>EasyData Server:</span>
      <div class="indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Offline</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
