<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">EasyData Fetch Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-950 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-4 flex min-h-16 max-w-[920px] sm:mx-auto items-center justify-between gap-5" aria-label="Main navigation">
      <a class="inline-flex items-center gap-2.5 text-xl font-extrabold no-underline" href="/">
        <span class="grid size-8 place-items-center rounded-lg bg-slate-950 text-white">E</span>
        <span>EasyData</span>
      </a>
      <!-- Language Switcher -->
      <div class="flex items-center gap-1 rounded-lg border border-slate-200 bg-slate-50 p-1">
        <button id="lang-en" class="rounded px-2 py-0.5 text-xs font-bold bg-slate-950 text-white" onclick="changeLanguage('en')">EN</button>
        <button id="lang-is" class="rounded px-2 py-0.5 text-xs font-bold text-slate-600" onclick="changeLanguage('is')">ÍS</button>
      </div>
    </nav>
  </header>

  <main class="mx-4 max-w-[920px] sm:mx-auto py-10">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-3xl font-black tracking-tight" data-i18n="demo-title">EasyData Fetch Demo</h1>
      <p class="mt-2 max-w-2xl leading-7 text-slate-600" data-i18n="demo-desc">Run each request in order to create an app, create a table, insert a row, and read it back through the EasyData API.</p>
      <div class="mt-6 flex flex-wrap gap-3">
        <button class="rounded-lg bg-slate-950 px-4 py-2.5 font-bold text-white hover:bg-slate-800" onclick="createApp()" data-i18n="btn-create-app">1. Create App</button>
        <button class="rounded-lg bg-slate-950 px-4 py-2.5 font-bold text-white hover:bg-slate-800" onclick="createTable()" data-i18n="btn-create-table">2. Create Table</button>
        <button class="rounded-lg bg-slate-950 px-4 py-2.5 font-bold text-white hover:bg-slate-800" onclick="insertRow()" data-i18n="btn-insert-row">3. Insert Row</button>
        <button class="rounded-lg bg-slate-950 px-4 py-2.5 font-bold text-white hover:bg-slate-800" onclick="getRows()" data-i18n="btn-get-rows">4. Get Rows</button>
      </div>
    </div>
    <pre id="output" class="mt-5 min-h-80 overflow-auto rounded-lg border border-slate-200 bg-slate-950 p-5 text-sm leading-7 text-slate-100" data-i18n="output-default">Click "1. Create App" to begin.</pre>
  </main>

  <script>
    const API_BASE = window.location.origin;
    let appId = "";
    let apiToken = "";
    
    const translations = {
      en: {
        "title": "EasyData Fetch Demo",
        "demo-title": "EasyData Fetch Demo",
        "demo-desc": "Run each request in order to create an app, create a table, insert a row, and read it back through the EasyData API.",
        "btn-create-app": "1. Create App",
        "btn-create-table": "2. Create Table",
        "btn-insert-row": "3. Insert Row",
        "btn-get-rows": "4. Get Rows",
        "output-default": "Click \"1. Create App\" to begin."
      },
      is: {
        "title": "EasyData Fetch Sýnishorn",
        "demo-title": "EasyData Fetch Sýnishorn",
        "demo-desc": "Keyrðu hverja beiðni í röð til að stofna app, búa til töflu, setja inn röð og lesa hana til baka í gegnum EasyData API.",
        "btn-create-app": "1. Stofna app",
        "btn-create-table": "2. Búa til töflu",
        "btn-insert-row": "3. Setja inn röð",
        "btn-get-rows": "4. Sækja raðir",
        "output-default": "Smelltu á \"1. Stofna app\" til að byrja."
      }
    };

    let currentLang = "en";

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[lang] && translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });
      
      const titleEl = document.querySelector('title[data-i18n="title"]');
      if (titleEl && translations[lang] && translations[lang]["title"]) {
        titleEl.textContent = translations[lang]["title"];
      }

      const enBtn = document.getElementById("lang-en");
      const isBtn = document.getElementById("lang-is");
      
      if (lang === "is") {
        isBtn.classList.add("bg-slate-950", "text-white");
        isBtn.classList.remove("text-slate-600");
        enBtn.classList.remove("bg-slate-950", "text-white");
        enBtn.classList.add("text-slate-600");
      } else {
        enBtn.classList.add("bg-slate-950", "text-white");
        enBtn.classList.remove("text-slate-600");
        isBtn.classList.remove("bg-slate-950", "text-white");
        isBtn.classList.add("text-slate-600");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang") || "en";
      changeLanguage(savedLang);
    });

    function print(data) { document.getElementById("output").textContent = JSON.stringify(data, null, 2); }
    async function createApp() {
      const res = await fetch(API_BASE + "/apps", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: "Browser Demo App", description: "Created from browser fetch demo" }) });
      const data = await res.json(); appId = data.id; apiToken = data.apiToken; print(data);
    }
    async function createTable() {
      const res = await fetch(API_BASE + "/apps/" + appId + "/tables", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiToken }, body: JSON.stringify({ tableName: "submissions", columns: [{ name: "student_name", type: "TEXT" }, { name: "photo_url", type: "TEXT" }] }) });
      print(await res.json());
    }
    async function insertRow() {
      const res = await fetch(API_BASE + "/apps/" + appId + "/tables/submissions/rows", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiToken }, body: JSON.stringify({ student_name: "Browser Student", photo_url: "/uploads/demo.jpg" }) });
      print(await res.json());
    }
    async function getRows() {
      const res = await fetch(API_BASE + "/apps/" + appId + "/tables/submissions/rows", { method: "GET", headers: { "Authorization": "Bearer " + apiToken } });
      print(await res.json());
    }
  </script>
</body>
</html>
