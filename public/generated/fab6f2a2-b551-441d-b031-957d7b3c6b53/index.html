<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Fair Projects</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#1f2937}.wrap{max-width:1000px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0 0 16px}.panel{background:#fff;border:1px solid #d9dee8;border-radius:8px;padding:16px;margin-bottom:16px}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.status{margin-left:12px;color:#4b5563}table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid #e5e7eb;text-align:left;padding:10px;vertical-align:top}th{background:#eef2f7;font-size:13px;text-transform:uppercase;letter-spacing:.03em}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:6px;padding:8px;font:inherit}textarea{min-height:58px}.actions{display:flex;gap:8px;align-items:center}.score{max-width:80px}.small{font-size:13px;color:#6b7280}</style></head><body><main class="wrap"><h1>Science Fair Projects</h1><section class="panel"><div class="actions"><button id="refreshBtn">Refresh projects</button><span id="status" class="status">Ready</span></div><p class="small">Rows are loaded from EasyData and sorted by score, highest first.</p></section><section class="panel"><table><thead><tr><th>Student</th><th>Project</th><th>Category</th><th>Score</th><th>Feedback</th><th>Status</th><th>Save</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody></table></section></main><script>const appId='fab6f2a2-b551-441d-b031-957d7b3c6b53';const apiToken='app_4480cb8badc90d72ab9bd9c02be2a5e05ccebb6d0ab18529';const table='projects';const base='https://easydata.is/apps/'+appId+'/tables/'+table+'/rows';const headers={'Content-Type':'application/json','Authorization':'Bearer '+apiToken,'X-API-Token':apiToken};const statusEl=document.getElementById('status');const tbody=document.getElementById('rows');function setStatus(t){statusEl.textContent=t}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function loadRows(){setStatus('Loading...');tbody.innerHTML='<tr><td colspan="7">Loading...</td></tr>';try{const res=await fetch(base+'?order=score:desc&limit=500',{headers});if(!res.ok)throw new Error('Could not load rows');const data=await res.json();const rows=(data.rows||[]).sort((a,b)=>(b.score||0)-(a.score||0));tbody.innerHTML=rows.map(r=>'<tr data-id="'+r.id+'"><td>'+esc(r.student_name)+'</td><td>'+esc(r.project_title)+'</td><td>'+esc(r.category)+'</td><td><input class="score" type="number" value="'+esc(r.score)+'"></td><td><textarea>'+esc(r.feedback)+'</textarea></td><td><input class="final" value="'+esc(r.final_status)+'"></td><td><button onclick="saveRow('+r.id+')">Save</button></td></tr>').join('')||'<tr><td colspan="7">No projects yet.</td></tr>';setStatus('Loaded '+rows.length+' projects')}catch(e){tbody.innerHTML='<tr><td colspan="7">'+esc(e.message)+'</td></tr>';setStatus('Error')}}async function saveRow(id){const tr=document.querySelector('tr[data-id="'+id+'"]');const body={score:Number(tr.querySelector('.score').value),feedback:tr.querySelector('textarea').value,final_status:tr.querySelector('.final').value};setStatus('Saving...');try{const res=await fetch(base+'/'+id,{method: 'PUT',headers,body:JSON.stringify(body)});if(!res.ok)throw new Error('Could not save row');setStatus('Saved');loadRows()}catch(e){setStatus(e.message)}}document.getElementById('refreshBtn').addEventListener('click',loadRows);loadRows();</script></body></html>
