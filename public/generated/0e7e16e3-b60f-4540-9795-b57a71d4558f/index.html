<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Exit Tickets</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #222; background: #f6f7f9; }
    body { margin: 0; padding: 24px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 18px; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    section { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    label { display: block; font-weight: 700; margin: 12px 0 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin-top: 14px; padding: 10px 14px; border: 0; border-radius: 6px; background: #2457a6; color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #4a5568; margin-left: 8px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { margin-top: 12px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #eef2f7; }
    .empty { padding: 14px; color: #666; }
    @media (max-width: 640px) { body { padding: 14px; } th, td { font-size: 14px; } }
  </style>
</head>
<body>
  <main>
    <h1>Classroom Exit Tickets</h1>

    <section>
      <h2>Student Ticket</h2>
      <form id="ticketForm">
        <label for="studentName">Name</label>
        <input id="studentName" name="studentName" maxlength="80" required>

        <label for="answer">Short answer</label>
        <textarea id="answer" name="answer" maxlength="500" required></textarea>

        <button id="submitButton" type="submit">Submit ticket</button>
        <div id="formMessage" class="message" role="status"></div>
      </form>
    </section>

    <section>
      <h2>Teacher View</h2>
      <button id="refreshButton" type="button" class="secondary">Refresh submissions</button>
      <div id="tableWrap" style="margin-top:14px;"></div>
    </section>
  </main>

  <script>
    const appId = "0e7e16e3-b60f-4540-9795-b57a71d4558f";
    const apiToken = "app_22a8d5c0b39cecbaba80953d2acf362f8e3cee71ebc60a09";
    const baseUrl = `https://easydata.is/apps/${appId}/tables/submissions/rows`;

    const headers = {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiToken}`,
      "X-API-Token": apiToken
    };

    const form = document.getElementById("ticketForm");
    const submitButton = document.getElementById("submitButton");
    const refreshButton = document.getElementById("refreshButton");
    const formMessage = document.getElementById("formMessage");
    const tableWrap = document.getElementById("tableWrap");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    async function loadSubmissions() {
      refreshButton.disabled = true;
      tableWrap.innerHTML = "<div class='empty'>Loading submissions...</div>";
      try {
        const response = await fetch(baseUrl, { headers });
        if (!response.ok) throw new Error("Could not load submissions.");
        const data = await response.json();
        const rows = Array.isArray(data) ? data : (data.rows || []);
        rows.sort((a, b) => new Date(b.submitted_at || 0) - new Date(a.submitted_at || 0));
        if (!rows.length) {
          tableWrap.innerHTML = "<div class='empty'>No submissions yet.</div>";
          return;
        }
        tableWrap.innerHTML = `<table><thead><tr><th>Name</th><th>Answer</th><th>Submitted</th></tr></thead><tbody>${rows.map(row => `<tr><td>${escapeHtml(row.student_name)}</td><td>${escapeHtml(row.answer)}</td><td>${escapeHtml(formatDate(row.submitted_at))}</td></tr>`).join("")}</tbody></table>`;
      } catch (error) {
        tableWrap.innerHTML = `<div class='empty'>${escapeHtml(error.message)}</div>`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      submitButton.disabled = true;
      formMessage.textContent = "Submitting...";
      const payload = {
        student_name: document.getElementById("studentName").value.trim(),
        answer: document.getElementById("answer").value.trim(),
        submitted_at: new Date().toISOString()
      };
      try {
        const response = await fetch(baseUrl, { method: "POST", headers, body: JSON.stringify(payload) });
        if (!response.ok) throw new Error("Your ticket was not submitted. Please try again.");
        form.reset();
        formMessage.textContent = "Submitted. Thank you.";
        await loadSubmissions();
      } catch (error) {
        formMessage.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    refreshButton.addEventListener("click", loadSubmissions);
    loadSubmissions();
  </script>
</body>
</html>
