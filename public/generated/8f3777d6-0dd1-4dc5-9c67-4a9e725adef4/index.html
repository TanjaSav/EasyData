<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Project Photo Turn-In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex flex-col gap-3 border-b border-slate-200 pb-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-950">Home Project Photo Turn-In</h1>
        <p class="mt-1 text-sm text-slate-600">Students can send a project photo from home. The teacher can review submissions below.</p>
      </div>
      <button id="refreshBtn" type="button" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-700">Refresh teacher view</button>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(360px,0.95fr)]">
      <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-semibold text-slate-950">Student turn-in</h2>
        <form id="submitForm" class="mt-4 space-y-4">
          <div>
            <label for="studentName" class="block text-sm font-medium text-slate-700">Student name</label>
            <input id="studentName" name="studentName" required maxlength="80" autocomplete="name" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-base shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20">
          </div>
          <div>
            <label for="projectTitle" class="block text-sm font-medium text-slate-700">Project title</label>
            <input id="projectTitle" name="projectTitle" required maxlength="120" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-base shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20">
          </div>
          <div>
            <label for="photoInput" class="block text-sm font-medium text-slate-700">Project photo</label>
            <input id="photoInput" name="photoInput" required type="file" accept="image/*" capture="environment" class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm file:mr-4 file:rounded-md file:border-0 file:bg-indigo-50 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100">
            <div id="previewWrap" class="mt-3 hidden overflow-hidden rounded-md border border-slate-200 bg-slate-100">
              <img id="photoPreview" alt="Selected project preview" class="max-h-80 w-full object-contain">
            </div>
          </div>
          <div>
            <label for="notes" class="block text-sm font-medium text-slate-700">Notes for the teacher</label>
            <textarea id="notes" name="notes" rows="4" maxlength="1000" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-base shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"></textarea>
          </div>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <button id="submitBtn" type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-slate-400">Turn in project</button>
            <p id="studentStatus" class="min-h-6 text-sm text-slate-600"></p>
          </div>
        </form>
      </div>

      <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h2 class="text-lg font-semibold text-slate-950">Teacher review</h2>
            <p id="teacherStatus" class="mt-1 text-sm text-slate-600">No submissions loaded yet.</p>
          </div>
          <select id="statusFilter" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm">
            <option value="all">All</option>
            <option value="New">New</option>
            <option value="Reviewed">Reviewed</option>
          </select>
        </div>
        <div id="submissionsList" class="mt-4 space-y-4"></div>
      </div>
    </section>
  </main>

  <script>
    const appId = "8f3777d6-0dd1-4dc5-9c67-4a9e725adef4";
    const apiToken = "app_88fdae208d05545849ec429bffab6824a22795c1ea5c2958";
    const tableName = "submissions";
    const rowsUrl = "/apps/" + appId + "/tables/" + tableName + "/rows";
    const authHeaders = { "Authorization": "Bearer " + apiToken };
    const jsonHeaders = { "Content-Type": "application/json", "Authorization": "Bearer " + apiToken };
    const form = document.getElementById("submitForm");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const previewWrap = document.getElementById("previewWrap");
    const studentStatus = document.getElementById("studentStatus");
    const teacherStatus = document.getElementById("teacherStatus");
    const submissionsList = document.getElementById("submissionsList");
    const statusFilter = document.getElementById("statusFilter");
    let selectedPhotoDataUrl = "";
    let submissions = [];

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>\"']/g, function(char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char];
      });
    }

    function rowsFrom(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.rows)) return data.rows;
      return [];
    }

    function resizeImage(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onerror = function() { reject(new Error("Could not read the photo.")); };
        reader.onload = function() {
          const img = new Image();
          img.onerror = function() { reject(new Error("Please choose a valid image file.")); };
          img.onload = function() {
            const maxSize = 1100;
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", async function() {
      selectedPhotoDataUrl = "";
      previewWrap.classList.add("hidden");
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      studentStatus.textContent = "Preparing photo...";
      try {
        selectedPhotoDataUrl = await resizeImage(file);
        photoPreview.src = selectedPhotoDataUrl;
        previewWrap.classList.remove("hidden");
        studentStatus.textContent = "Photo ready.";
      } catch (error) {
        studentStatus.textContent = error.message;
      }
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      if (!selectedPhotoDataUrl) {
        studentStatus.textContent = "Please choose a project photo first.";
        return;
      }
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      studentStatus.textContent = "Turning in project...";
      const body = {
        student_name: document.getElementById("studentName").value.trim(),
        project_title: document.getElementById("projectTitle").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        photo_data_url: selectedPhotoDataUrl,
        submitted_at: new Date().toISOString(),
        status: "New",
        teacher_comment: ""
      };
      try {
        const response = await fetch(rowsUrl, { method: "POST", headers: jsonHeaders, body: JSON.stringify(body) });
        if (!response.ok) throw new Error("The project could not be turned in. Try again.");
        form.reset();
        selectedPhotoDataUrl = "";
        previewWrap.classList.add("hidden");
        studentStatus.textContent = "Project turned in. Thank you.";
        await loadSubmissions();
      } catch (error) {
        studentStatus.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function loadSubmissions() {
      teacherStatus.textContent = "Loading submissions...";
      try {
        const response = await fetch(rowsUrl + "?order=submitted_at:desc&limit=500", { headers: authHeaders });
        if (!response.ok) throw new Error("Submissions could not be loaded.");
        const data = await response.json();
        submissions = rowsFrom(data);
        renderSubmissions();
      } catch (error) {
        teacherStatus.textContent = error.message;
        submissionsList.innerHTML = "";
      }
    }

    function renderSubmissions() {
      const filter = statusFilter.value;
      const visible = submissions.filter(function(row) { return filter === "all" || (row.status || "New") === filter; });
      teacherStatus.textContent = submissions.length + " submission" + (submissions.length === 1 ? "" : "s") + " total.";
      if (!visible.length) {
        submissionsList.innerHTML = "<div class=\"rounded-md border border-dashed border-slate-300 p-6 text-center text-sm text-slate-500\">No submissions to show.</div>";
        return;
      }
      submissionsList.innerHTML = visible.map(function(row) {
        const dateText = row.submitted_at ? new Date(row.submitted_at).toLocaleString() : "No date";
        const status = row.status || "New";
        return "<article class=\"rounded-lg border border-slate-200 bg-slate-50 p-4\" data-id=\"" + row.id + "\">" +
          "<div class=\"flex flex-col gap-3 sm:flex-row\">" +
            "<img src=\"" + escapeHtml(row.photo_data_url) + "\" alt=\"Project photo from " + escapeHtml(row.student_name) + "\" class=\"h-56 w-full rounded-md border border-slate-200 bg-white object-contain sm:w-56\">" +
            "<div class=\"min-w-0 flex-1\">" +
              "<div class=\"flex flex-wrap items-start justify-between gap-2\">" +
                "<div><h3 class=\"text-base font-semibold text-slate-950\">" + escapeHtml(row.project_title) + "</h3><p class=\"text-sm text-slate-600\">" + escapeHtml(row.student_name) + "</p></div>" +
                "<span class=\"rounded-full px-2.5 py-1 text-xs font-semibold " + (status === "Reviewed" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800") + "\">" + escapeHtml(status) + "</span>" +
              "</div>" +
              "<p class=\"mt-2 whitespace-pre-wrap text-sm text-slate-700\">" + escapeHtml(row.notes || "No notes added.") + "</p>" +
              "<p class=\"mt-2 text-xs text-slate-500\">Submitted " + escapeHtml(dateText) + "</p>" +
              "<label class=\"mt-3 block text-sm font-medium text-slate-700\">Teacher comment</label>" +
              "<textarea data-field=\"teacher_comment\" rows=\"2\" class=\"mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm\">" + escapeHtml(row.teacher_comment) + "</textarea>" +
              "<div class=\"mt-3 flex flex-wrap gap-2\">" +
                "<button type=\"button\" data-action=\"save\" class=\"rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500\">Save comment</button>" +
                "<button type=\"button\" data-action=\"reviewed\" class=\"rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-500\">Mark reviewed</button>" +
                "<button type=\"button\" data-action=\"delete\" class=\"rounded-md bg-white px-3 py-2 text-sm font-semibold text-red-700 ring-1 ring-inset ring-red-200 hover:bg-red-50\">Delete</button>" +
              "</div>" +
            "</div>" +
          "</div>" +
        "</article>";
      }).join("");
    }

    submissionsList.addEventListener("click", async function(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const article = button.closest("article[data-id]");
      const rowId = article.getAttribute("data-id");
      const comment = article.querySelector("textarea[data-field='teacher_comment']").value.trim();
      const action = button.getAttribute("data-action");
      button.disabled = true;
      teacherStatus.textContent = "Saving...";
      try {
        if (action === "delete") {
          const ok = confirm("Delete this submission?");
          if (!ok) return;
          const response = await fetch(rowsUrl + "/" + rowId, { method: "DELETE", headers: authHeaders });
          if (!response.ok) throw new Error("Could not delete submission.");
        } else {
          const body = { teacher_comment: comment };
          if (action === "reviewed") body.status = "Reviewed";
          const response = await fetch(rowsUrl + "/" + rowId, { method: "PUT", headers: jsonHeaders, body: JSON.stringify(body) });
          if (!response.ok) throw new Error("Could not save review.");
        }
        await loadSubmissions();
      } catch (error) {
        teacherStatus.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", loadSubmissions);
    statusFilter.addEventListener("change", renderSubmissions);
    loadSubmissions();
  </script>
</body>
</html>
