<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Reading Tracker</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f4;color:#222}header{background:#24504a;color:white;padding:18px 20px}main{max-width:960px;margin:0 auto;padding:20px}.panel{background:white;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}label{display:block;font-weight:700;margin:10px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:6px;font:inherit}button{margin-top:12px;background:#24504a;color:white;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;border-bottom:1px solid #ddd;padding:10px;vertical-align:top}th{background:#eef3f1}.muted{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:14px}th,td{padding:8px}}
</style>
</head>
<body>
<header><h1>Class Reading Tracker</h1><div class="muted" style="color:#d9e8e4">Reading logs ordered by pages read</div></header>
<main>
<section class="panel">
<h2>Add a Reading Log</h2>
<form id="logForm">
<div class="grid">
<div><label for="student_name">Student name</label><input id="student_name" required></div>
<div><label for="book_title">Book title</label><input id="book_title" required></div>
<div><label for="pages_read">Pages read</label><input id="pages_read" type="number" min="0" required></div>
<div><label for="reading_date">Reading date</label><input id="reading_date" type="date" required></div>
</div>
<label for="teacher_comment">Teacher comment</label><textarea id="teacher_comment" rows="3"></textarea>
<button type="submit">Add log</button>
<span id="status" class="muted"></span>
</form>
</section>
<section class="panel">
<h2>Reading Logs</h2>
<table>
<thead><tr><th>Student</th><th>Book</th><th>Pages</th><th>Date</th><th>Comment</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</section>
<section class="panel">
<h2>Schema</h2>
<pre id="schemaView" style="white-space:pre-wrap;overflow:auto"></pre>
</section>
</main>
<script>
const appId='6eac0091-d584-4c61-8879-4d93d5175ce6';
const apiToken='app_5fcad232482b7a2a15811ab90bec2cf0f477cbf94b53099f';
const tableName='reading_logs';
const baseUrl='https://easydata.is/apps/'+appId+'/tables/'+tableName+'/rows';
const schemaData={"appId":"6eac0091-d584-4c61-8879-4d93d5175ce6","schema":[{"table":"_easydata_meta","columns":[{"cid":0,"name":"key","type":"TEXT","notnull":0,"dflt_value":null,"pk":1},{"cid":1,"name":"value","type":"TEXT","notnull":1,"dflt_value":null,"pk":0}]},{"table":"reading_logs","columns":[{"cid":0,"name":"id","type":"INTEGER","notnull":0,"dflt_value":null,"pk":1},{"cid":1,"name":"student_name","type":"TEXT","notnull":0,"dflt_value":null,"pk":0},{"cid":2,"name":"book_title","type":"TEXT","notnull":0,"dflt_value":null,"pk":0},{"cid":3,"name":"pages_read","type":"INTEGER","notnull":0,"dflt_value":null,"pk":0},{"cid":4,"name":"reading_date","type":"TEXT","notnull":0,"dflt_value":null,"pk":0},{"cid":5,"name":"teacher_comment","type":"TEXT","notnull":0,"dflt_value":null,"pk":0}]}]};
const fallbackRows=[{"id":3,"student_name":"John","book_title":"Charlotte's Web","pages_read":30,"reading_date":"2026-05-16","teacher_comment":"Excellent"},{"id":1,"student_name":"Alex","book_title":"Harry Potter","pages_read":25,"reading_date":"2026-05-16","teacher_comment":"Good progress"},{"id":2,"student_name":"Maria","book_title":"The Hobbit","pages_read":18,"reading_date":"2026-05-16","teacher_comment":"Keep going"}];
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+apiToken,'x-api-token':apiToken};}
function render(rows){document.getElementById('rows').innerHTML=rows.map(r=>'<tr><td>'+escapeHtml(r.student_name)+'</td><td>'+escapeHtml(r.book_title)+'</td><td>'+Number(r.pages_read||0)+'</td><td>'+escapeHtml(r.reading_date)+'</td><td>'+escapeHtml(r.teacher_comment||'')+'</td></tr>').join('');}
function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadRows(){try{const res=await fetch(baseUrl+'?order=pages_read:desc&limit=500',{headers:headers()});if(!res.ok)throw new Error('Load failed');const data=await res.json();render(data.rows||data||[]);}catch(e){render(fallbackRows);document.getElementById('status').textContent=' Showing saved starter data.';}}
document.getElementById('logForm').addEventListener('submit',async e=>{e.preventDefault();const row={student_name:student_name.value,book_title:book_title.value,pages_read:Number(pages_read.value),reading_date:reading_date.value,teacher_comment:teacher_comment.value};status.textContent=' Saving...';try{const res=await fetch(baseUrl,{method:'POST',headers:headers(),body:JSON.stringify(row)});if(!res.ok)throw new Error('Save failed');e.target.reset();status.textContent=' Saved.';loadRows();}catch(err){status.textContent=' Could not save. Check the connection and token.';}});
document.getElementById('schemaView').textContent=JSON.stringify(schemaData,null,2);
loadRows();
</script>
</body>
</html>
