<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Project Submissions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex flex-col gap-3 border-b border-slate-200 pb-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-950 sm:text-3xl">Student Project Submissions</h1>
        <p class="mt-1 text-sm text-slate-600">Students add project details and a photo. Teachers can review every submission below.</p>
      </div>
      <button id="refreshBtn" type="button" class="inline-flex items-center justify-center rounded-md bg-white px-4 py-2 text-sm font-medium text-slate-800 shadow-sm ring-1 ring-slate-300 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">Refresh</button>
    </header>
    <section class="grid gap-6 lg:grid-cols-[minmax(0,380px)_1fr]">
      <form id="submissionForm" class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <h2 class="text-lg font-semibold text-slate-950">New Submission</h2>
        <div class="mt-5 space-y-4">
          <label class="block"><span class="text-sm font-medium text-slate-700">Student name</span><input id="studentName" name="student_name" required maxlength="120" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="First and last name"></label>
          <label class="block"><span class="text-sm font-medium text-slate-700">Project title</span><input id="projectTitle" name="project_title" required maxlength="160" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Project title"></label>
          <label class="block"><span class="text-sm font-medium text-slate-700">Notes</span><textarea id="notes" name="notes" rows="5" maxlength="1200" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="What should your teacher know about this project?"></textarea></label>
          <label class="block"><span class="text-sm font-medium text-slate-700">Photo</span><input id="photoInput" name="photo" type="file" accept="image/*" required class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 file:mr-3 file:rounded-md file:border-0 file:bg-blue-50 file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-blue-700 hover:file:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500"></label>
          <img id="preview" alt="Selected project preview" class="hidden h-48 w-full rounded-md object-cover ring-1 ring-slate-200">
          <p id="status" class="min-h-5 text-sm text-slate-600" role="status"></p>
          <button id="submitBtn" type="submit" class="inline-flex w-full items-center justify-center rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:cursor-not-allowed disabled:bg-slate-400">Submit Project</button>
        </div>
      </form>
      <section class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"><div><h2 class="text-lg font-semibold text-slate-950">Teacher View</h2><p id="countText" class="text-sm text-slate-600">Loading submissions...</p></div></div>
        <div id="emptyState" class="mt-6 hidden rounded-md border border-dashed border-slate-300 p-8 text-center text-sm text-slate-600">No submissions yet.</div>
        <div id="submissionList" class="mt-5 grid gap-4"></div>
      </section>
    </section>
  </main>
  <script>
    const appId = "a35603ff-f449-4bd4-8d00-230397a57bc7";
    const apiToken = "app_bb76ea67604a91e6573bbbce5e8e04e8c49accb99e644f1f";
    const tableName = "submissions";
    const rowsUrl = "/apps/" + appId + "/tables/" + tableName + "/rows";
    const headers = { "Authorization": "Bearer " + apiToken, "Content-Type": "application/json" };
    const form = document.getElementById("submissionForm"), submitBtn = document.getElementById("submitBtn"), refreshBtn = document.getElementById("refreshBtn"), statusEl = document.getElementById("status"), listEl = document.getElementById("submissionList"), emptyState = document.getElementById("emptyState"), countText = document.getElementById("countText"), photoInput = document.getElementById("photoInput"), preview = document.getElementById("preview");
    function setStatus(message, isError) { statusEl.textContent = message || ""; statusEl.className = "min-h-5 text-sm " + (isError ? "text-red-700" : "text-slate-600"); }
    function normalizeRows(data) { if (Array.isArray(data)) return data; if (Array.isArray(data.rows)) return data.rows; if (Array.isArray(data.data)) return data.data; return []; }
    function getRowId(row) { return row.id || row.rowId || row._id; }
    function escapeText(value) { return String(value || "").replace(/[&<>'"]/g, function(char) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" }[char]; }); }
    function formatDate(value) { if (!value) return ""; const date = new Date(value); return Number.isNaN(date.getTime()) ? value : date.toLocaleString(); }
    async function imageToDataUrl(file) { const rawDataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); }); const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = rawDataUrl; }); const maxSide = 1200; const scale = Math.min(1, maxSide / Math.max(image.width, image.height)); const canvas = document.createElement("canvas"); canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale)); canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height); return canvas.toDataURL("image/jpeg", 0.82); }
    photoInput.addEventListener("change", async () => { const file = photoInput.files && photoInput.files[0]; if (!file) { preview.classList.add("hidden"); preview.removeAttribute("src"); return; } try { preview.src = await imageToDataUrl(file); preview.classList.remove("hidden"); } catch (error) { setStatus("Could not preview that photo. Please choose another image.", true); } });
    async function loadRows() { countText.textContent = "Loading submissions..."; const response = await fetch(rowsUrl, { headers }); if (!response.ok) throw new Error("Could not load submissions."); const rows = normalizeRows(await response.json()).sort((a, b) => String(b.submitted_at || "").localeCompare(String(a.submitted_at || ""))); renderRows(rows); }
    function renderRows(rows) { countText.textContent = rows.length === 1 ? "1 submission" : rows.length + " submissions"; emptyState.classList.toggle("hidden", rows.length !== 0); listEl.innerHTML = rows.map(row => { const id = getRowId(row); return `<article class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">${row.photo ? `<img src="${row.photo}" alt="Project photo for ${escapeText(row.project_title)}" class="h-56 w-full object-cover sm:h-64">` : ""}<div class="p-4"><div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><div><h3 class="text-base font-semibold text-slate-950">${escapeText(row.project_title)}</h3><p class="mt-1 text-sm font-medium text-slate-700">${escapeText(row.student_name)}</p><p class="mt-1 text-xs text-slate-500">${escapeText(formatDate(row.submitted_at))}</p></div>${id ? `<button type="button" data-delete-id="${id}" class="inline-flex items-center justify-center rounded-md border border-red-200 px-3 py-1.5 text-sm font-medium text-red-700 hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500">Delete</button>` : ""}</div>${row.notes ? `<p class="mt-3 whitespace-pre-wrap text-sm leading-6 text-slate-700">${escapeText(row.notes)}</p>` : ""}</div></article>`; }).join(""); }
    form.addEventListener("submit", async event => { event.preventDefault(); const file = photoInput.files && photoInput.files[0]; if (!file) { setStatus("Please choose a project photo.", true); return; } submitBtn.disabled = true; setStatus("Submitting project..."); try { const payload = { student_name: document.getElementById("studentName").value.trim(), project_title: document.getElementById("projectTitle").value.trim(), notes: document.getElementById("notes").value.trim(), photo: preview.src && !preview.classList.contains("hidden") ? preview.src : await imageToDataUrl(file), submitted_at: new Date().toISOString() }; const response = await fetch(rowsUrl, { method: "POST", headers, body: JSON.stringify(payload) }); if (!response.ok) throw new Error("Submission failed."); form.reset(); preview.classList.add("hidden"); preview.removeAttribute("src"); setStatus("Submitted. Your teacher can see it now."); await loadRows(); } catch (error) { setStatus(error.message || "Could not submit the project.", true); } finally { submitBtn.disabled = false; } });
    listEl.addEventListener("click", async event => { const button = event.target.closest("[data-delete-id]"); if (!button) return; if (!confirm("Delete this submission?")) return; button.disabled = true; const response = await fetch(rowsUrl + "/" + button.dataset.deleteId, { method: "DELETE", headers }); if (!response.ok) { alert("Could not delete that submission."); button.disabled = false; return; } await loadRows(); });
    refreshBtn.addEventListener("click", () => loadRows().catch(error => { countText.textContent = "Could not load submissions."; setStatus(error.message, true); }));
    loadRows().catch(error => { countText.textContent = "Could not load submissions."; setStatus(error.message, true); });
  </script>
</body>
</html>
