<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Upload Check</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f4f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 460px;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.2rem; }
  .subtitle { font-size: 0.88rem; color: #718096; margin-bottom: 1.75rem; }
  .drop-zone {
    border: 2px dashed #cbd5e0;
    border-radius: 12px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    background: #f7fafc;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone:hover, .drop-zone.over { border-color: #4f46e5; background: #eef2ff; }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 2.5rem; margin-bottom: 0.4rem; }
  .drop-label { font-size: 0.95rem; color: #4a5568; }
  .drop-hint { font-size: 0.78rem; color: #a0aec0; margin-top: 0.2rem; }
  .file-name { margin-top: 0.7rem; font-size: 0.84rem; color: #4f46e5; font-weight: 500; min-height: 1.2em; }
  button {
    margin-top: 1.2rem; width: 100%; padding: 0.75rem;
    background: #4f46e5; color: #fff; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:not(:disabled):hover { background: #4338ca; }
  .spinner {
    display: inline-block; width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    display: none; margin-top: 1.1rem;
    background: #fff5f5; border: 1px solid #feb2b2;
    border-radius: 8px; padding: 0.7rem 1rem;
    font-size: 0.87rem; color: #c53030;
  }
  .error-box.show { display: block; }
  .result { display: none; margin-top: 1.5rem; }
  .result.show { display: block; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.8rem; font-weight: 600; color: #276749;
    background: #f0fff4; border: 1px solid #9ae6b4;
    border-radius: 20px; padding: 3px 10px; margin-bottom: 0.65rem;
  }
  .result img {
    width: 100%; border-radius: 10px;
    border: 1px solid #e2e8f0; margin-bottom: 0.75rem; display: block;
  }
  .url-box {
    background: #f7fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 0.6rem 0.85rem;
    font-size: 0.82rem; word-break: break-all; color: #2d3748;
  }
  .url-box a { color: #4f46e5; text-decoration: none; }
  .url-box a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>📸 Photo Upload Check</h1>
  <p class="subtitle">Pick an image to test the EasyData upload endpoint.</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
    <div class="drop-icon">🖼️</div>
    <div class="drop-label">Click to choose a photo</div>
    <div class="drop-hint">JPG · PNG · WebP &nbsp;|&nbsp; max 10 MB</div>
  </div>
  <div class="file-name" id="fileName"></div>

  <button id="uploadBtn" disabled>Upload Image</button>

  <div class="error-box" id="errorBox"></div>

  <div class="result" id="result">
    <div class="badge">✅ Upload successful</div>
    <img id="preview" src="" alt="Uploaded image" />
    <div class="url-box">
      <strong>File URL:</strong><br />
      <a id="fileUrl" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script>
  const API_TOKEN  = "app_03dce7634b933f4939a1f6f08ed1731287294554b0a30c91";
  const UPLOAD_URL = "https://easydata.is/apps/ff015473-6046-4f04-bc7f-89451f9216af/files";

  const fileInput = document.getElementById("fileInput");
  const dropZone  = document.getElementById("dropZone");
  const fileNameEl= document.getElementById("fileName");
  const uploadBtn = document.getElementById("uploadBtn");
  const errorBox  = document.getElementById("errorBox");
  const result    = document.getElementById("result");
  const preview   = document.getElementById("preview");
  const fileUrlEl = document.getElementById("fileUrl");

  const ALLOWED = ["image/jpeg","image/png","image/webp"];
  const MAX = 10 * 1024 * 1024;
  let chosen = null;

  function pick(file) {
    if (!file) return;
    if (!ALLOWED.includes(file.type)) { showErr("Only JPG, PNG, or WebP images are accepted."); return; }
    if (file.size > MAX) { showErr("File is too large — please choose an image under 10 MB."); return; }
    chosen = file;
    fileNameEl.textContent = `Selected: ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
    uploadBtn.disabled = false;
    hideErr();
    result.classList.remove("show");
  }

  fileInput.addEventListener("change", () => pick(fileInput.files[0]));
  dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("over"); pick(e.dataTransfer.files[0]); });

  uploadBtn.addEventListener("click", async () => {
    if (!chosen) return;
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<span class="spinner"></span>Uploading…';
    hideErr();
    result.classList.remove("show");

    try {
      const fd = new FormData();
      fd.append("file", chosen);

      const res = await fetch(UPLOAD_URL, {
        method: "POST",
        headers: { "Authorization": `Bearer ${API_TOKEN}` },
        body: fd
      });

      let json = null;
      try { json = await res.json(); } catch(_) {}

      if (!res.ok) {
        throw new Error(json?.error || json?.message || `Server error ${res.status}`);
      }

      const url = json?.url || json?.fileUrl || json?.file_url || json?.path || json?.file?.url || json?.data?.url || json?.data?.file?.url;
      if (!url) throw new Error("Upload succeeded but no file URL found in response: " + JSON.stringify(json));

      const full = url.startsWith("http") ? url : "https://easydata.is" + url;
      preview.src = full;
      fileUrlEl.href = full;
      fileUrlEl.textContent = full;
      result.classList.add("show");
    } catch(err) {
      showErr("Upload failed: " + (err.message || "Unknown error."));
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = "Upload Image";
    }
  });

  function showErr(msg) { errorBox.textContent = msg; errorBox.classList.add("show"); }
  function hideErr()     { errorBox.textContent = ""; errorBox.classList.remove("show"); }
</script>
</body>
</html>
