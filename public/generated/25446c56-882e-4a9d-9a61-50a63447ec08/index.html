<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Care Tracker</title>
<style>
  :root {
    --teal: #0d9488;
    --teal-dark: #0f766e;
    --teal-pale: #f0fdfa;
    --teal-soft: #99f6e4;
    --teal-mid: #2dd4bf;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f8fafc;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--teal) 0%, #0f766e 100%);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    color: white;
  }
  .header-badge {
    font-size: 3rem;
    display: block;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
  }
  .header h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .header p { opacity: 0.85; margin-top: 0.3rem; font-size: 0.92rem; }

  .stats-bar {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.2);
    margin-top: 1.25rem;
    padding: 0.85rem 1.5rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 1.5rem; font-weight: 800; line-height: 1; }
  .stat-lbl { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.15rem; }

  /* ── MAIN ── */
  .main { max-width: 920px; margin: 0 auto; padding: 1.75rem 1rem 4rem; }

  /* ── SECTION HEAD ── */
  .section-head {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.1rem;
  }
  .section-head h2 { font-size: 1rem; font-weight: 700; color: var(--text); }
  .section-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--teal);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  /* ── FORM ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media(max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  .full { grid-column: 1 / -1; }

  .fg { display: flex; flex-direction: column; gap: 0.35rem; }
  .fg label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .fg input, .fg select {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.62rem 0.9rem;
    font-size: 0.93rem;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .fg input:focus, .fg select:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(13,148,136,0.13);
  }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 1.2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--bg);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--teal); background: var(--teal-pale); }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon { font-size: 1.6rem; margin-bottom: 0.3rem; }
  .upload-text { font-size: 0.82rem; color: var(--muted); }
  .upload-text strong { color: var(--teal); }

  .preview-wrap {
    display: none;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.6rem;
  }
  .preview-wrap.show { display: flex; }
  .preview-thumb {
    width: 52px; height: 52px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid var(--teal-soft);
  }
  .preview-name { font-size: 0.82rem; color: var(--muted); flex: 1; word-break: break-all; }
  .preview-clear {
    background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--muted); padding: 0.2rem;
  }
  .preview-clear:hover { color: var(--red); }

  .upload-progress {
    display: none;
    height: 4px;
    background: var(--teal-soft);
    border-radius: 99px;
    margin-top: 0.5rem;
    overflow: hidden;
  }
  .upload-progress.show { display: block; }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 99px;
    animation: progress-anim 1.2s ease-in-out infinite;
  }
  @keyframes progress-anim {
    0% { width: 0%; } 60% { width: 80%; } 100% { width: 95%; }
  }

  /* ── BUTTONS ── */
  .btn-row { margin-top: 1.1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.62rem 1.35rem;
    border-radius: 9px;
    border: none;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--teal);
    color: white;
    box-shadow: 0 2px 8px rgba(13,148,136,0.35);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--teal-dark);
    box-shadow: 0 4px 14px rgba(13,148,136,0.4);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: white;
    color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--teal); color: var(--teal); }

  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.76rem; border-radius: 7px; gap: 0.25rem; }

  .btn-edit {
    background: var(--blue-bg);
    color: var(--blue);
    border: 1.5px solid #bfdbfe;
  }
  .btn-edit:hover { background: #dbeafe; }

  .btn-del {
    background: var(--red-bg);
    color: var(--red);
    border: 1.5px solid #fecaca;
  }
  .btn-del:hover { background: #fecaca; }

  /* ── PET CARDS GRID ── */
  .pets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .pet-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .pet-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

  .pet-card-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: var(--teal-pale);
  }
  .pet-card-img-placeholder {
    width: 100%;
    height: 140px;
    background: var(--teal-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .pet-card-body { padding: 0.9rem; }
  .pet-card-name { font-weight: 700; font-size: 1rem; color: var(--text); }
  .pet-card-type {
    display: inline-block;
    margin-top: 0.25rem;
    padding: 0.15rem 0.55rem;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--teal-pale);
    color: var(--teal-dark);
  }
  .pet-card-meta { margin-top: 0.5rem; font-size: 0.78rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.2rem; }
  .pet-card-actions { padding: 0.6rem 0.9rem; border-top: 1px solid var(--border); display: flex; gap: 0.4rem; background: var(--bg); }

  /* ── TABLE ── */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table { width: 100%; border-collapse: collapse; min-width: 580px; font-size: 0.87rem; }
  thead tr { border-bottom: 2px solid var(--border); }
  th {
    padding: 0.6rem 0.85rem;
    text-align: left;
    font-size: 0.69rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--teal-pale); }
  td { padding: 0.75rem 0.85rem; vertical-align: middle; }

  .tbl-photo {
    width: 42px; height: 42px;
    border-radius: 8px;
    object-fit: cover;
    border: 2px solid var(--teal-soft);
    background: var(--teal-pale);
    display: block;
  }
  .tbl-photo-placeholder {
    width: 42px; height: 42px;
    border-radius: 8px;
    background: var(--teal-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    border: 2px solid var(--teal-soft);
  }
  .pet-name-cell { font-weight: 600; }
  .type-chip {
    display: inline-block;
    padding: 0.18rem 0.6rem;
    border-radius: 99px;
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--teal-pale);
    color: var(--teal-dark);
  }
  .date-cell { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  .act-cell { display: flex; gap: 0.35rem; }

  .empty-state {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--muted);
  }
  .empty-emoji { font-size: 3rem; margin-bottom: 0.6rem; opacity: 0.35; }

  /* ── VIEW TOGGLE ── */
  .view-toggle { display: flex; gap: 0.4rem; margin-left: auto; }
  .toggle-btn {
    padding: 0.3rem 0.65rem;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
    color: var(--muted);
  }
  .toggle-btn.active { background: var(--teal); border-color: var(--teal); color: white; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #111827;
    color: #f9fafb;
    padding: 0.65rem 1.3rem;
    border-radius: 99px;
    font-size: 0.84rem;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s cubic-bezier(.34,1.5,.64,1);
    pointer-events: none;
    z-index: 999;
    box-shadow: 0 6px 24px rgba(0,0,0,0.22);
    display: flex; align-items: center; gap: 0.5rem;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .spin {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.5s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: var(--radius);
    padding: 1.5rem;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; }
  .modal p { font-size: 0.88rem; color: var(--muted); margin-bottom: 1.2rem; }
  .modal-btns { display: flex; gap: 0.6rem; justify-content: flex-end; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="header-badge">🐾</span>
  <h1>Pet Care Tracker</h1>
  <p>Keep track of all your furry, feathery & scaly friends</p>
  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Pets</div></div>
    <div class="stat"><div class="stat-val" id="s-types">—</div><div class="stat-lbl">Types</div></div>
    <div class="stat"><div class="stat-val" id="s-avg">—</div><div class="stat-lbl">Avg Age</div></div>
    <div class="stat"><div class="stat-val" id="s-due">—</div><div class="stat-lbl">Due Checkup</div></div>
  </div>
</div>

<div class="main">

  <!-- ADD / EDIT FORM -->
  <div class="card">
    <div class="section-head">
      <div class="section-icon" id="form-icon">＋</div>
      <h2 id="form-heading">Add a Pet</h2>
    </div>
    <div class="form-grid">
      <div class="fg">
        <label for="f-name">Pet Name</label>
        <input id="f-name" type="text" placeholder="e.g. Biscuit, Luna…">
      </div>
      <div class="fg">
        <label for="f-type">Animal Type</label>
        <select id="f-type">
          <option value="">Select type…</option>
          <option>Dog</option><option>Cat</option><option>Rabbit</option>
          <option>Bird</option><option>Fish</option><option>Hamster</option>
          <option>Guinea Pig</option><option>Reptile</option><option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label for="f-age">Age (years)</label>
        <input id="f-age" type="number" min="0" max="100" placeholder="3">
      </div>
      <div class="fg">
        <label for="f-checkup">Last Checkup Date</label>
        <input id="f-checkup" type="date">
      </div>
      <div class="fg full">
        <label>Photo</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="f-photo" accept="image/*">
          <div id="upload-placeholder">
            <div class="upload-icon">📸</div>
            <div class="upload-text"><strong>Click to upload</strong> or drag & drop<br>JPG, PNG, GIF, WebP</div>
          </div>
        </div>
        <div class="preview-wrap" id="preview-wrap">
          <img class="preview-thumb" id="preview-thumb" src="" alt="preview">
          <span class="preview-name" id="preview-name"></span>
          <button class="preview-clear" onclick="clearPhoto()" title="Remove photo">✕</button>
        </div>
        <div class="upload-progress" id="upload-progress"><div class="progress-fill"></div></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submit-btn" onclick="submitForm()">
        <span id="submit-inner">🐾 Add Pet</span>
      </button>
      <button class="btn btn-ghost" id="cancel-btn" style="display:none" onclick="cancelEdit()">✕ Cancel</button>
      <span id="upload-status" style="font-size:0.78rem;color:var(--muted);margin-left:0.25rem"></span>
    </div>
  </div>

  <!-- PET LIST -->
  <div class="card">
    <div class="section-head">
      <div class="section-icon">🐶</div>
      <h2>All Pets</h2>
      <div class="view-toggle">
        <button class="toggle-btn active" id="btn-grid" onclick="setView('grid')" title="Card view">⊞</button>
        <button class="toggle-btn" id="btn-table" onclick="setView('table')" title="Table view">☰</button>
      </div>
    </div>

    <!-- GRID VIEW -->
    <div id="view-grid">
      <div class="pets-grid" id="pets-grid"></div>
    </div>

    <!-- TABLE VIEW -->
    <div id="view-table" style="display:none">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Photo</th><th>Name</th><th>Type</th><th>Age</th><th>Last Checkup</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="pets-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <h3>Remove Pet</h3>
    <p id="del-msg">Are you sure you want to remove this pet?</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-del" id="confirm-del-btn" onclick="confirmDelete()">🗑️ Remove</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const APP    = '25446c56-882e-4a9d-9a61-50a63447ec08';
const TOKEN  = 'app_2cd2862e4ab3eb45edf242b8d71c7e6d6d688ab18e0b3400';
const BASE   = 'https://easydata.is/api';
const UPLOAD = `https://easydata.is/apps/${APP}/files`;
const TABLE  = 'pets';

let editId       = null;
let deleteId     = null;
let pendingPhoto = null; // { file, localUrl }
let currentView  = 'grid';
let toastTimer;

const h = () => ({ 'Authorization': `Bearer ${TOKEN}` });
const hj = () => ({ ...h(), 'Content-Type': 'application/json' });

/* ── ANIMAL EMOJI ── */
const animalEmoji = {
  Dog:'🐶', Cat:'🐱', Rabbit:'🐰', Bird:'🐦',
  Fish:'🐠', Hamster:'🐹', 'Guinea Pig':'🐾', Reptile:'🦎', Other:'🐾'
};
const getEmoji = t => animalEmoji[t] || '🐾';

/* ── FILE INPUT ── */
document.getElementById('f-photo').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  setPendingPhoto(file);
});

const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) setPendingPhoto(file);
});

function setPendingPhoto(file) {
  pendingPhoto = { file, localUrl: URL.createObjectURL(file) };
  document.getElementById('preview-thumb').src = pendingPhoto.localUrl;
  document.getElementById('preview-name').textContent = file.name;
  document.getElementById('preview-wrap').classList.add('show');
  document.getElementById('upload-placeholder').style.display = 'none';
}

function clearPhoto() {
  pendingPhoto = null;
  document.getElementById('f-photo').value = '';
  document.getElementById('preview-wrap').classList.remove('show');
  document.getElementById('preview-thumb').src = '';
  document.getElementById('upload-placeholder').style.display = '';
}

/* ── UPLOAD IMAGE ── */
async function uploadPhoto(file) {
  const prog = document.getElementById('upload-progress');
  const status = document.getElementById('upload-status');
  prog.classList.add('show');
  status.textContent = 'Uploading photo…';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(UPLOAD, { method: 'POST', headers: h(), body: fd });
    const j = await r.json();
    prog.classList.remove('show');
    status.textContent = '';
    return j.url || j.fileUrl || j.path || null;
  } catch(e) {
    prog.classList.remove('show');
    status.textContent = '';
    toast('Photo upload failed — saving without image', '⚠️');
    return null;
  }
}

/* ── LOAD DATA ── */
async function load() {
  try {
    const r = await fetch(`${BASE}/${APP}/tables/${TABLE}/rows?order=id:desc`, { headers: hj() });
    const { rows = [] } = await r.json();
    renderStats(rows);
    renderGrid(rows);
    renderTable(rows);
  } catch { toast('Failed to load pets', '❌'); }
}

/* ── STATS ── */
function renderStats(rows) {
  const total = rows.length;
  const types = new Set(rows.map(r => r.animal_type).filter(Boolean)).size;
  const avg   = total ? (rows.reduce((s,r)=>s+(r.age||0),0)/total).toFixed(1) : '—';
  const sixMonths = new Date(); sixMonths.setMonth(sixMonths.getMonth()-6);
  const due = rows.filter(r => r.last_checkup && new Date(r.last_checkup) < sixMonths).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-types').textContent = types || '—';
  document.getElementById('s-avg').textContent   = avg !== '—' ? avg+'y' : '—';
  document.getElementById('s-due').textContent   = due;
}

/* ── GRID RENDER ── */
function renderGrid(rows) {
  const grid = document.getElementById('pets-grid');
  if (!rows.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-emoji">🐾</div><p>No pets yet — add your first one!</p></div>`;
    return;
  }
  grid.innerHTML = rows.map(r => {
    const imgEl = r.photo_url
      ? `<img class="pet-card-img" src="${esc(r.photo_url)}" alt="${esc(r.pet_name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        + `<div class="pet-card-img-placeholder" style="display:none">${getEmoji(r.animal_type)}</div>`
      : `<div class="pet-card-img-placeholder">${getEmoji(r.animal_type)}</div>`;
    return `
      <div class="pet-card">
        ${imgEl}
        <div class="pet-card-body">
          <div class="pet-card-name">${esc(r.pet_name||'—')}</div>
          <span class="pet-card-type">${getEmoji(r.animal_type)} ${esc(r.animal_type||'—')}</span>
          <div class="pet-card-meta">
            <span>🎂 Age: <b>${r.age != null ? r.age+'y' : '—'}</b></span>
            <span>🏥 Checkup: <b>${fmtDate(r.last_checkup)}</b></span>
          </div>
        </div>
        <div class="pet-card-actions">
          <button class="btn btn-sm btn-edit" onclick='startEdit(${r.id},${safe(r)})'>✏️ Edit</button>
          <button class="btn btn-sm btn-del" onclick="askDelete(${r.id},'${esc(r.pet_name||'')}')">🗑️ Remove</button>
        </div>
      </div>`;
  }).join('');
}

/* ── TABLE RENDER ── */
function renderTable(rows) {
  const tb = document.getElementById('pets-tbody');
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-emoji">🐾</div><p>No pets yet</p></div></td></tr>`;
    return;
  }
  tb.innerHTML = rows.map((r, i) => {
    const imgEl = r.photo_url
      ? `<img class="tbl-photo" src="${esc(r.photo_url)}" alt="${esc(r.pet_name)}" onerror="this.outerHTML='<div class=\\'tbl-photo-placeholder\\'>${getEmoji(r.animal_type)}</div>'">`
      : `<div class="tbl-photo-placeholder">${getEmoji(r.animal_type)}</div>`;
    return `<tr>
      <td>${imgEl}</td>
      <td class="pet-name-cell">${esc(r.pet_name||'—')}</td>
      <td><span class="type-chip">${getEmoji(r.animal_type)} ${esc(r.animal_type||'—')}</span></td>
      <td>${r.age != null ? r.age+'y' : '—'}</td>
      <td class="date-cell">📅 ${fmtDate(r.last_checkup)}</td>
      <td class="act-cell">
        <button class="btn btn-sm btn-edit" onclick='startEdit(${r.id},${safe(r)})'>✏️ Edit</button>
        <button class="btn btn-sm btn-del" onclick="askDelete(${r.id},'${esc(r.pet_name||'')}')">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

/* ── VIEW TOGGLE ── */
function setView(v) {
  currentView = v;
  document.getElementById('view-grid').style.display  = v === 'grid'  ? '' : 'none';
  document.getElementById('view-table').style.display = v === 'table' ? '' : 'none';
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
}

/* ── SUBMIT ── */
async function submitForm() {
  const name    = document.getElementById('f-name').value.trim();
  const type    = document.getElementById('f-type').value;
  const age     = document.getElementById('f-age').value;
  const checkup = document.getElementById('f-checkup').value;

  if (!name) return toast('Enter a pet name', '⚠️');
  if (!type) return toast('Select an animal type', '⚠️');

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  document.getElementById('submit-inner').innerHTML = '<span class="spin"></span>';

  let photo_url = null;

  // If editing, keep existing photo unless a new one was chosen
  if (editId && !pendingPhoto) {
    // fetch existing row's photo_url
    try {
      const r = await fetch(`${BASE}/${APP}/tables/${TABLE}/rows?where=id:${editId}`, { headers: hj() });
      const j = await r.json();
      photo_url = (j.rows && j.rows[0]) ? j.rows[0].photo_url : null;
    } catch {}
  }

  if (pendingPhoto) {
    photo_url = await uploadPhoto(pendingPhoto.file);
  }

  const body = {
    pet_name: name,
    animal_type: type,
    age: age !== '' ? parseInt(age) : null,
    photo_url: photo_url,
    last_checkup: checkup || null
  };

  try {
    if (editId) {
      await fetch(`${BASE}/${APP}/tables/${TABLE}/rows/${editId}`, { method:'PATCH', headers:hj(), body:JSON.stringify(body) });
      toast('Pet updated! 🐾', '✅');
      cancelEdit();
    } else {
      await fetch(`${BASE}/${APP}/tables/${TABLE}/rows`, { method:'POST', headers:hj(), body:JSON.stringify(body) });
      toast('Pet added! 🎉', '✅');
      clearForm();
    }
    await load();
  } catch { toast('Something went wrong', '❌'); }
  finally {
    btn.disabled = false;
    document.getElementById('submit-inner').textContent = editId ? '💾 Save Changes' : '🐾 Add Pet';
  }
}

/* ── EDIT ── */
function startEdit(id, row) {
  editId = id;
  document.getElementById('f-name').value    = row.pet_name || '';
  document.getElementById('f-type').value    = row.animal_type || '';
  document.getElementById('f-age').value     = row.age != null ? row.age : '';
  document.getElementById('f-checkup').value = row.last_checkup || '';
  clearPhoto();
  if (row.photo_url) {
    document.getElementById('preview-thumb').src = row.photo_url;
    document.getElementById('preview-name').textContent = 'Current photo';
    document.getElementById('preview-wrap').classList.add('show');
    document.getElementById('upload-placeholder').style.display = 'none';
  }
  document.getElementById('form-heading').textContent = 'Edit Pet';
  document.getElementById('form-icon').textContent    = '✏️';
  document.getElementById('submit-inner').textContent  = '💾 Save Changes';
  document.getElementById('cancel-btn').style.display  = 'inline-flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editId = null;
  clearForm();
  clearPhoto();
  document.getElementById('form-heading').textContent = 'Add a Pet';
  document.getElementById('form-icon').textContent    = '＋';
  document.getElementById('submit-inner').textContent  = '🐾 Add Pet';
  document.getElementById('cancel-btn').style.display  = 'none';
}

function clearForm() {
  ['f-name','f-age','f-checkup'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value = '';
  clearPhoto();
}

/* ── DELETE ── */
function askDelete(id, name) {
  deleteId = id;
  document.getElementById('del-msg').textContent = `Remove "${name}" from your pet list? This cannot be undone.`;
  document.getElementById('del-modal').classList.add('show');
}
function closeModal() {
  deleteId = null;
  document.getElementById('del-modal').classList.remove('show');
}
async function confirmDelete() {
  if (!deleteId) return;
  closeModal();
  try {
    await fetch(`${BASE}/${APP}/tables/${TABLE}/rows/${deleteId}`, { method:'DELETE', headers:hj() });
    toast('Pet removed', '🗑️');
    await load();
  } catch { toast('Failed to delete', '❌'); }
  deleteId = null;
}

/* ── HELPERS ── */
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
  catch { return d; }
}
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safe = o => JSON.stringify(o).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/'/g,'\\u0027').replace(/&/g,'\\u0026');

/* ── TOAST ── */
function toast(msg, icon='') {
  const el = document.getElementById('toast');
  el.innerHTML = icon ? `<span>${icon}</span><span>${msg}</span>` : `<span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// Close modal on overlay click
document.getElementById('del-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

load();
</script>
</body>
