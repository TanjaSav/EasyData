<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Projects Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-4 border-b border-gray-300">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Classroom Projects Portfolio</h1>
                <p class="text-gray-600">Submit, view, and grade student project submissions.</p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-2 bg-white p-1 rounded-lg border shadow-sm">
                <button id="tabStudent" onclick="switchRole('student')" class="px-4 py-2 rounded-md font-medium text-sm transition bg-blue-600 text-white">Student View</button>
                <button id="tabTeacher" onclick="switchRole('teacher')" class="px-4 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-900">Teacher Dashboard</button>
            </div>
        </header>

        
        <div id="passwordModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-xl">
                <h3 class="text-lg font-semibold mb-3">Teacher Authentication</h3>
                <input type="password" id="teacherPwd" placeholder="Enter password" class="w-full border p-2 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="flex justify-end space-x-2">
                    <button onclick="cancelTeacherAuth()" class="px-4 py-2 text-gray-500 hover:text-gray-700">Cancel</button>
                    <button onclick="verifyTeacherAuth()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Verify</button>
                </div>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <section id="submissionSection" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 class="text-xl font-bold mb-4 text-gray-700">New Project Submission</h2>
                <form id="projectForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project Title</label>
                        <input type="text" id="title" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="description" rows="3" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project Image</label>
                        <input type="file" id="imageFile" accept="image/*" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Student Self Score (1-10)</label>
                        <input type="number" id="studentScore" min="1" max="10" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition disabled:opacity-50">Upload & Submit</button>
                </form>
            </section>

            
            <section class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-700">Portfolio Submissions</h2>
                    <button onclick="fetchProjects()" class="text-sm text-blue-600 hover:underline">🔄 Refresh</button>
                </div>
                <div id="projectsList" class="space-y-6">
                    <div class="text-center py-12 text-gray-500 bg-white border rounded-xl">Loading submissions...</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const appId = '33d1da1f-c565-4bb1-8f97-786c59c7d980';
        const apiToken = 'app_2b09a5238bbf212ecd43163c787df5abb838cc70aa2756f7';
        const baseUrl = '';
        let currentRole = 'student';
        let isAuthenticatedTeacher = false;

        const headers = {
            'Authorization': `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
        };

        function switchRole(role) {
            if (role === 'teacher' && !isAuthenticatedTeacher) {
                document.getElementById('passwordModal').classList.remove('hidden');
                return;
            }
            updateRoleUI(role);
        }

        function updateRoleUI(role) {
            currentRole = role;
            const isTeacher = role === 'teacher';
            
            document.getElementById('tabStudent').className = isTeacher ? 'px-4 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-900' : 'px-4 py-2 rounded-md font-medium text-sm transition bg-blue-600 text-white';
            document.getElementById('tabTeacher').className = isTeacher ? 'px-4 py-2 rounded-md font-medium text-sm transition bg-blue-600 text-white' : 'px-4 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-900';
            
            document.getElementById('submissionSection').className = isTeacher ? 'hidden' : 'bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit';
            document.getElementById('submissionSection').parentElement.className = isTeacher ? 'grid grid-cols-1 gap-8' : 'grid grid-cols-1 lg:grid-cols-3 gap-8';
            
            fetchProjects();
        }

        function verifyTeacherAuth() {
            const pwd = document.getElementById('teacherPwd').value;
            if (pwd === '1234') {
                isAuthenticatedTeacher = true;
                document.getElementById('passwordModal').classList.add('hidden');
                updateRoleUI('teacher');
            } else {
                alert('Invalid Teacher Password!');
            }
        }

        function cancelTeacherAuth() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('teacherPwd').value = '';
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Uploading file...';

            try {
                const fileInput = document.getElementById('imageFile');
                if (!fileInput.files.length) return alert('Please choose an image file.');
                
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('file', file);

                const fileRes = await fetch(`${baseUrl}/apps/${appId}/files`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiToken}` },
                    body: formData
                });
                const fileData = await fileRes.json();

                btn.innerText = 'Creating entry...';
                const payload = {
                    project_title: document.getElementById('title').value,
                    project_description: document.getElementById('description').value,
                    project_image_file_name: fileData.fileName || file.name,
                    project_image_url: fileData.url || fileData.viewUrl || '',
                    student_score: parseInt(document.getElementById('studentScore').value) || 1,
                    teacher_score: null,
                    teacher_comment: '',
                    created_at: new Date().toISOString()
                };

                await fetch(`${baseUrl}/apps/${appId}/tables/projects/rows`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                document.getElementById('projectForm').reset();
                alert('Project submission successfully uploaded!');
                fetchProjects();
            } catch (err) {
                console.error(err);
                alert('Submission failed. Check console.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Upload & Submit';
            }
        }

        async function fetchProjects() {
            const list = document.getElementById('projectsList');
            try {
                const res = await fetch(`${baseUrl}/apps/${appId}/tables/projects/rows`, { method: 'GET', headers: headers });
                const data = await res.json();
                const rows = data.rows || data || [];

                if (rows.length === 0) {
                    list.innerHTML = `<div class="text-center py-12 text-gray-500 bg-white border rounded-xl">No submissions found.</div>`;
                    return;
                }

                let html = '';
                for (const row of rows) {
                    let secureViewUrl = row.project_image_url;
                    
                    if (row.project_image_file_name) {
                        try {
                            const urlRes = await fetch(`${baseUrl}/apps/${appId}/files/${encodeURIComponent(row.project_image_file_name)}/view-url`, {
                                method: 'POST',
                                headers: headers
                            });
                            const urlData = await urlRes.json();
                            secureViewUrl = urlData.viewUrl || urlData.url || secureViewUrl;
                        } catch (fileErr) { console.error('Tokenized URL error', fileErr); }
                    }

                    html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">
                        ${secureViewUrl ? `<img src="${secureViewUrl}" class="w-full md:w-48 h-48 object-cover flex-shrink-0 bg-gray-200" alt="Project Asset">` : ''}
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="text-xl font-bold text-gray-800">${row.project_title || 'Untitled'}</h3>
                                    <span class="text-xs text-gray-400">${row.created_at ? new Date(row.created_at).toLocaleDateString() : ''}</span>
                                </div>
                                <p class="text-gray-600 mt-2 text-sm">${row.project_description || ''}</p>
                                
                                <div class="mt-4 grid grid-cols-2 gap-4 bg-gray-50 p-3 rounded-lg border text-sm">
                                    <div><span class="font-semibold text-gray-600">Student Score:</span> ${row.student_score || 0}/10</div>
                                    <div><span class="font-semibold text-gray-600">Teacher Score:</span> ${row.teacher_score !== null && row.teacher_score !== undefined ? row.teacher_score + '/10' : '<span class="text-amber-600 italic">Ungraded</span>'}</div>
                                </div>
                                ${row.teacher_comment ? `<div class="mt-3 text-sm bg-blue-50 border border-blue-100 text-blue-800 p-2 rounded"><strong>Teacher Feedback:</strong> ${row.teacher_comment}</div>` : ''}
                            </div>

                            ${currentRole === 'teacher' ? `
                            <div class="mt-6 pt-4 border-t flex flex-col sm:flex-row items-end gap-3">
                                <div class="w-full sm:w-24">
                                    <label class="block text-xs font-semibold text-gray-500 uppercase">Grade (1-10)</label>
                                    <input type="number" id="score-${row.id}" value="${row.teacher_score || ''}" min="1" max="10" class="w-full border rounded p-1.5 text-sm">
                                </div>
                                <div class="flex-1 w-full">
                                    <label class="block text-xs font-semibold text-gray-500 uppercase">Comments</label>
                                    <input type="text" id="comment-${row.id}" value="${row.teacher_comment || ''}" class="w-full border rounded p-1.5 text-sm" placeholder="Feedback summary...">
                                </div>
                                <button onclick="submitGrade('${row.id}')" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-md font-medium transition">Save</button>
                            </div>
                            ` : ''}
                        </div>
                    </div>`;
                }
                list.innerHTML = html;
            } catch (err) {
                list.innerHTML = `<div class="text-center py-12 text-red-500 bg-white border rounded-xl">Failed to load rows.</div>`;
            }
        }

        async function submitGrade(rowId) {
            const scoreVal = document.getElementById(`score-${rowId}`).value;
            const commentVal = document.getElementById(`comment-${rowId}`).value;

            const payload = {
                teacher_score: scoreVal !== '' ? parseInt(scoreVal) : null,
                teacher_comment: commentVal
            };

            try {
                await fetch(`${baseUrl}/apps/${appId}/tables/projects/rows/${rowId}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                alert('Evaluation published successfully.');
                fetchProjects();
            } catch (err) {
                console.error(err);
                alert('Error processing submission adjustment.');
            }
        }

        // Init list rendering
        fetchProjects();
    </script>
<script>(function(){const appId="33d1da1f-c565-4bb1-8f97-786c59c7d980";function send(type,payload){try{fetch('/apps/'+appId+'/client-errors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({type,url:location.href,userAgent:navigator.userAgent},payload))});}catch(e){}}window.addEventListener('error',function(event){send('error',{message:event.message,source:event.filename,lineno:event.lineno,colno:event.colno,stack:event.error&&event.error.stack});});window.addEventListener('unhandledrejection',function(event){const reason=event.reason;send('unhandledrejection',{message:reason&&reason.message?reason.message:String(reason),stack:reason&&reason.stack});});})();</script>
</body>
</html>
