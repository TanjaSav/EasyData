<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0fdf4;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --accent: #16a34a;
    --accent-light: #22c55e;
    --accent-pale: #dcfce7;
    --text: #0f172a;
    --muted: #64748b;
    --easy: #16a34a;
    --easy-bg: #dcfce7;
    --moderate: #d97706;
    --moderate-bg: #fef3c7;
    --hard: #dc2626;
    --hard-bg: #fee2e2;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .header-icon {
    width: 56px; height: 56px;
    background: var(--accent);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 0.75rem;
    box-shadow: 0 4px 14px rgba(22,163,74,0.35);
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  header p { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; }

  /* ── LAYOUT ── */
  .container { max-width: 900px; margin: 0 auto; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.4rem;
  }

  .card-header h2 {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .card-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ── STATS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }

  .stat-box .stat-val {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .stat-box .stat-lbl {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.3rem;
  }

  /* ── FORM ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

  label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  input, select {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 0.65rem 0.9rem;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.18s, box-shadow 0.18s;
    width: 100%;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
  }

  select option { background: #fff; }

  .form-row-full { grid-column: 1 / -1; }

  .form-actions {
    margin-top: 1.25rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1.4rem;
    border-radius: 9px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(22,163,74,0.3);
  }
  .btn-primary:hover:not(:disabled) {
    background: #15803d;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(22,163,74,0.4);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-sm { padding: 0.38rem 0.8rem; font-size: 0.78rem; border-radius: 7px; }

  .btn-edit {
    background: #eff6ff;
    color: #2563eb;
    border: 1.5px solid #bfdbfe;
  }
  .btn-edit:hover { background: #dbeafe; }

  .btn-delete {
    background: #fff1f2;
    color: var(--hard);
    border: 1.5px solid #fecdd3;
  }
  .btn-delete:hover { background: #ffe4e6; }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 560px; }

  thead tr { border-bottom: 2px solid var(--border); }

  th {
    text-align: left;
    padding: 0.65rem 0.9rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td { padding: 0.85rem 0.9rem; vertical-align: middle; }

  .exercise-name { font-weight: 600; color: var(--text); }

  .duration-cell {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--muted);
    font-weight: 500;
  }
  .duration-bar {
    height: 4px;
    border-radius: 99px;
    background: var(--accent-pale);
    flex: 1;
    min-width: 40px;
    max-width: 80px;
    overflow: hidden;
  }
  .duration-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
  }

  .badge {
    display: inline-block;
    padding: 0.22rem 0.65rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .badge-easy    { background: var(--easy-bg);     color: var(--easy); }
  .badge-moderate{ background: var(--moderate-bg); color: var(--moderate); }
  .badge-hard    { background: var(--hard-bg);     color: var(--hard); }
  .badge-default { background: var(--surface2);    color: var(--muted); }

  .date-cell { color: var(--muted); font-size: 0.83rem; white-space: nowrap; }

  .actions-cell { display: flex; gap: 0.4rem; }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: #1e293b;
    color: #f8fafc;
    padding: 0.75rem 1.2rem;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.28s cubic-bezier(.34,1.4,.64,1);
    pointer-events: none;
    z-index: 999;
    max-width: 300px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: #7f1d1d; }
  #toast.success { background: #14532d; }

  /* ── SPINNER ── */
  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.55s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-icon">💪</div>
    <h1>Workout Tracker</h1>
    <p>Log, manage, and crush your fitness goals</p>
  </header>

  <!-- STATS -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-box"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Workouts</div></div>
    <div class="stat-box"><div class="stat-val" id="s-mins">—</div><div class="stat-lbl">Total Minutes</div></div>
    <div class="stat-box"><div class="stat-val" id="s-avg">—</div><div class="stat-lbl">Avg Duration</div></div>
    <div class="stat-box"><div class="stat-val" id="s-hard">—</div><div class="stat-lbl">Hard Sessions</div></div>
  </div>

  <!-- FORM CARD -->
  <div class="card">
    <div class="card-header">
      <div class="dot"></div>
      <h2 id="form-heading">Add a Workout</h2>
    </div>
    <div class="form-grid">
      <div class="form-group form-row-full">
        <label for="exercise_name">Exercise Name</label>
        <input type="text" id="exercise_name" placeholder="e.g. Morning Run, HIIT, Cycling…" />
      </div>
      <div class="form-group">
        <label for="duration_minutes">Duration (minutes)</label>
        <input type="number" id="duration_minutes" min="1" max="600" placeholder="30" />
      </div>
      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="">Select difficulty…</option>
          <option>Easy</option>
          <option>Moderate</option>
          <option>Hard</option>
        </select>
      </div>
      <div class="form-group">
        <label for="workout_date">Date</label>
        <input type="date" id="workout_date" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="submit-btn" onclick="submitForm()">
        <span id="submit-label">Add Workout</span>
      </button>
      <button class="btn btn-ghost" id="cancel-btn" style="display:none" onclick="cancelEdit()">✕ Cancel</button>
    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="card">
    <div class="card-header">
      <div class="dot"></div>
      <h2>All Workouts</h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Exercise</th>
            <th>Duration</th>
            <th>Difficulty</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="workouts-tbody">
          <tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading workouts…</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  const APP_ID    = 'b641a11b-5707-4363-b448-ae2a7d8953aa';
  const API_TOKEN = 'app_571fa19d1d2787f6f1c8a8952787f1c54d8261184fa8a60a';
  const BASE      = '/apps';
  const TABLE     = 'workouts';

  let editingId = null;
  let toastTimer;

  const hdrs = () => ({
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${API_TOKEN}`
  });

  // set today's date as default
  document.getElementById('workout_date').value = new Date().toISOString().slice(0, 10);

  /* ── DATA ── */
  async function fetchAll() {
    const r = await fetch(`${BASE}/${APP_ID}/tables/${TABLE}/rows?order=id:desc`, { headers: hdrs() });
    const j = await r.json();
    return j.rows || [];
  }

  async function load() {
    try {
      const rows = await fetchAll();
      renderStats(rows);
      renderTable(rows);
    } catch(e) {
      toast('Could not load workouts', 'error');
    }
  }

  /* ── STATS ── */
  function renderStats(rows) {
    const total = rows.length;
    const mins  = rows.reduce((s, r) => s + (r.duration_minutes || 0), 0);
    const avg   = total ? Math.round(mins / total) : 0;
    const hard  = rows.filter(r => r.difficulty === 'Hard').length;
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-mins').textContent  = mins;
    document.getElementById('s-avg').textContent   = avg ? avg + 'm' : '—';
    document.getElementById('s-hard').textContent  = hard;
  }

  /* ── TABLE ── */
  function diffBadge(d) {
    const map = { Easy: 'easy', Moderate: 'moderate', Hard: 'hard' };
    const cls = map[d] || 'default';
    const icon = { Easy: '🟢', Moderate: '🟡', Hard: '🔴' }[d] || '';
    return `<span class="badge badge-${cls}">${icon} ${esc(d || '—')}</span>`;
  }

  function durBar(mins) {
    const pct = Math.min(100, Math.round((mins / 90) * 100));
    return `
      <div class="duration-cell">
        <span style="min-width:36px;font-weight:600;color:var(--text)">${mins}m</span>
        <div class="duration-bar"><div class="duration-fill" style="width:${pct}%"></div></div>
      </div>`;
  }

  function fmtDate(d) {
    if (!d) return '—';
    try {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    } catch { return d; }
  }

  function renderTable(rows) {
    const tbody = document.getElementById('workouts-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🏋️</div><p>No workouts yet — add your first one above!</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td style="color:var(--muted);font-size:0.78rem;font-weight:500">${i + 1}</td>
        <td class="exercise-name">${esc(r.exercise_name || '—')}</td>
        <td>${r.duration_minutes ? durBar(r.duration_minutes) : '—'}</td>
        <td>${diffBadge(r.difficulty)}</td>
        <td class="date-cell">📅 ${fmtDate(r.workout_date)}</td>
        <td>
          <div class="actions-cell">
            <button class="btn btn-sm btn-edit" onclick='startEdit(${r.id}, ${safeJson(r)})'>✏️ Edit</button>
            <button class="btn btn-sm btn-delete" onclick="deleteRow(${r.id})">🗑️ Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function safeJson(obj) {
    return JSON.stringify(obj).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/'/g,'\\u0027');
  }

  /* ── FORM SUBMIT ── */
  async function submitForm() {
    const name  = document.getElementById('exercise_name').value.trim();
    const mins  = parseInt(document.getElementById('duration_minutes').value);
    const diff  = document.getElementById('difficulty').value;
    const date  = document.getElementById('workout_date').value;

    if (!name)                    return toast('Please enter an exercise name', 'error');
    if (!mins || mins < 1)        return toast('Enter a valid duration', 'error');
    if (!diff)                    return toast('Please select a difficulty', 'error');
    if (!date)                    return toast('Please pick a date', 'error');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    const body = { exercise_name: name, duration_minutes: mins, difficulty: diff, workout_date: date };

    try {
      if (editingId) {
        await fetch(`${BASE}/${APP_ID}/tables/${TABLE}/rows/${editingId}`, {
          method: 'PUT', headers: hdrs(), body: JSON.stringify(body)
        });
        toast('Workout updated! 💪', 'success');
        cancelEdit();
      } else {
        await fetch(`${BASE}/${APP_ID}/tables/${TABLE}/rows`, {
          method: 'POST', headers: hdrs(), body: JSON.stringify(body)
        });
        toast('Workout logged! 🎉', 'success');
        clearForm();
      }
      await load();
    } catch(e) {
      toast('Something went wrong', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span id="submit-label">${editingId ? 'Save Changes' : 'Add Workout'}</span>`;
    }
  }

  /* ── EDIT ── */
  function startEdit(id, row) {
    editingId = id;
    document.getElementById('exercise_name').value   = row.exercise_name || '';
    document.getElementById('duration_minutes').value = row.duration_minutes || '';
    document.getElementById('difficulty').value       = row.difficulty || '';
    document.getElementById('workout_date').value     = row.workout_date || '';
    document.getElementById('form-heading').textContent = 'Edit Workout';
    document.getElementById('submit-label').textContent = 'Save Changes';
    document.getElementById('cancel-btn').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    clearForm();
    document.getElementById('form-heading').textContent = 'Add a Workout';
    document.getElementById('submit-label').textContent = 'Add Workout';
    document.getElementById('cancel-btn').style.display = 'none';
  }

  function clearForm() {
    document.getElementById('exercise_name').value = '';
    document.getElementById('duration_minutes').value = '';
    document.getElementById('difficulty').value = '';
    document.getElementById('workout_date').value = new Date().toISOString().slice(0, 10);
  }

  /* ── DELETE ── */
  async function deleteRow(id) {
    if (!confirm('Remove this workout from your log?')) return;
    try {
      await fetch(`${BASE}/${APP_ID}/tables/${TABLE}/rows/${id}`, {
        method: 'DELETE', headers: hdrs()
      });
      toast('Workout deleted', 'success');
      await load();
    } catch(e) {
      toast('Failed to delete', 'error');
    }
  }

  /* ── TOAST ── */
  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    const icon = type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';
    el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 3200);
  }

  load();
</script>
</body>
</html>
