<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6">
      <h1 class="text-3xl font-bold tracking-tight text-slate-950">Recipe Notes</h1>
      <p class="mt-2 text-sm text-slate-600">Add, update, and organize classroom-friendly recipe ideas.</p>
    </header>
    <section class="mb-8 rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 id="formTitle" class="text-lg font-semibold text-slate-950">Add a Recipe</h2>
        <button id="cancelEditBtn" type="button" class="hidden rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel edit</button>
      </div>
      <form id="recipeForm" class="grid gap-4 md:grid-cols-2">
        <input type="hidden" id="recipeId">
        <div><label for="recipeName" class="mb-1 block text-sm font-medium text-slate-700">Recipe name</label><input id="recipeName" name="recipe_name" type="text" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"></div>
        <div><label for="cookingTime" class="mb-1 block text-sm font-medium text-slate-700">Cooking time</label><input id="cookingTime" name="cooking_time" type="text" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"></div>
        <div class="md:col-span-2"><label for="ingredients" class="mb-1 block text-sm font-medium text-slate-700">Ingredients</label><textarea id="ingredients" name="ingredients" rows="3" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"></textarea></div>
        <div><label for="difficulty" class="mb-1 block text-sm font-medium text-slate-700">Difficulty</label><select id="difficulty" name="difficulty" required class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"><option value="">Choose one</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
        <div class="flex items-end"><button id="submitBtn" type="submit" class="w-full rounded-md bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-300">Add Recipe</button></div>
      </form>
      <p id="message" class="mt-3 hidden rounded-md px-3 py-2 text-sm"></p>
    </section>
    <section class="rounded-lg border border-slate-200 bg-white shadow-sm">
      <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-6"><h2 class="text-lg font-semibold text-slate-950">All Recipes</h2><button id="refreshBtn" type="button" class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Refresh</button></div>
      <div class="overflow-x-auto"><table class="min-w-full divide-y divide-slate-200 text-sm"><thead class="bg-slate-100 text-left text-xs font-semibold uppercase tracking-wide text-slate-600"><tr><th class="px-4 py-3 sm:px-6">Recipe</th><th class="px-4 py-3 sm:px-6">Ingredients</th><th class="px-4 py-3 sm:px-6">Time</th><th class="px-4 py-3 sm:px-6">Difficulty</th><th class="px-4 py-3 text-right sm:px-6">Actions</th></tr></thead><tbody id="recipeRows" class="divide-y divide-slate-200 bg-white"></tbody></table></div>
      <div id="emptyState" class="hidden p-6 text-center text-sm text-slate-500">No recipes yet. Add one above.</div>
    </section>
  </main>
  <script>
    const appId = 'c06a7e1e-77f3-4979-b354-e51c619e15df';
    const apiToken = 'app_9ad50695ddf2ed335bc9f35673ef17419a6430d1c6c9d95d';
    const tableName = 'recipes';
    const baseUrl = `https://easydata.is/apps/${appId}/tables/${tableName}/rows`;
    const form = document.getElementById('recipeForm'), recipeId = document.getElementById('recipeId'), recipeName = document.getElementById('recipeName'), ingredients = document.getElementById('ingredients'), cookingTime = document.getElementById('cookingTime'), difficulty = document.getElementById('difficulty'), rows = document.getElementById('recipeRows'), emptyState = document.getElementById('emptyState'), message = document.getElementById('message'), submitBtn = document.getElementById('submitBtn'), formTitle = document.getElementById('formTitle'), cancelEditBtn = document.getElementById('cancelEditBtn'), refreshBtn = document.getElementById('refreshBtn');
    let recipes = [];
    function authHeaders(){return {'Content-Type':'application/json','Authorization':`Bearer ${apiToken}`,'X-API-Token':apiToken};}
    function showMessage(text,type='success'){message.textContent=text;message.className=`mt-3 rounded-md px-3 py-2 text-sm ${type==='error'?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700'}`;message.classList.remove('hidden');setTimeout(()=>message.classList.add('hidden'),3000);}
    function escapeHtml(value){return String(value ?? '').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
    function resetForm(){form.reset();recipeId.value='';formTitle.textContent='Add a Recipe';submitBtn.textContent='Add Recipe';cancelEditBtn.classList.add('hidden');}
    function renderRecipes(){rows.innerHTML='';emptyState.classList.toggle('hidden',recipes.length>0);recipes.forEach(recipe=>{const tr=document.createElement('tr');tr.className='align-top';tr.innerHTML=`<td class="px-4 py-4 font-medium text-slate-950 sm:px-6">${escapeHtml(recipe.recipe_name)}</td><td class="max-w-md px-4 py-4 text-slate-700 sm:px-6">${escapeHtml(recipe.ingredients)}</td><td class="px-4 py-4 text-slate-700 sm:px-6">${escapeHtml(recipe.cooking_time)}</td><td class="px-4 py-4 text-slate-700 sm:px-6">${escapeHtml(recipe.difficulty)}</td><td class="px-4 py-4 text-right sm:px-6"><div class="flex justify-end gap-2"><button type="button" data-action="edit" data-id="${recipe.id}" class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50">Edit</button><button type="button" data-action="delete" data-id="${recipe.id}" class="rounded-md bg-red-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-700">Delete</button></div></td>`;rows.appendChild(tr);});}
    async function loadRecipes(){try{const response=await fetch(baseUrl,{headers:authHeaders()});if(!response.ok)throw new Error('Could not load recipes.');const data=await response.json();recipes=Array.isArray(data.rows)?data.rows:Array.isArray(data)?data:[];renderRecipes();}catch(error){showMessage(error.message,'error');}}
    async function saveRecipe(event){event.preventDefault();const payload={recipe_name:recipeName.value.trim(),ingredients:ingredients.value.trim(),cooking_time:cookingTime.value.trim(),difficulty:difficulty.value};const editing=Boolean(recipeId.value);try{const response=await fetch(editing?`${baseUrl}/${recipeId.value}`:baseUrl,{method:editing?'PATCH':'POST',headers:authHeaders(),body:JSON.stringify(payload)});if(!response.ok)throw new Error(editing?'Could not update recipe.':'Could not add recipe.');showMessage(editing?'Recipe updated.':'Recipe added.');resetForm();await loadRecipes();}catch(error){showMessage(error.message,'error');}}
    function startEdit(id){const recipe=recipes.find(item=>String(item.id)===String(id));if(!recipe)return;recipeId.value=recipe.id;recipeName.value=recipe.recipe_name||'';ingredients.value=recipe.ingredients||'';cookingTime.value=recipe.cooking_time||'';difficulty.value=recipe.difficulty||'';formTitle.textContent='Edit Recipe';submitBtn.textContent='Save Changes';cancelEditBtn.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
    async function deleteRecipe(id){if(!confirm('Delete this recipe?'))return;try{const response=await fetch(`${baseUrl}/${id}`,{method:'DELETE',headers:authHeaders()});if(!response.ok)throw new Error('Could not delete recipe.');showMessage('Recipe deleted.');await loadRecipes();}catch(error){showMessage(error.message,'error');}}
    rows.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;if(button.dataset.action==='edit')startEdit(button.dataset.id);if(button.dataset.action==='delete')deleteRecipe(button.dataset.id);});
    form.addEventListener('submit',saveRecipe);cancelEditBtn.addEventListener('click',resetForm);refreshBtn.addEventListener('click',loadRecipes);loadRecipes();
  </script>
</body>
</html>
