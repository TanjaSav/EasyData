<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Score Dash</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#172033}.wrap{max-width:980px;margin:0 auto;padding:18px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}h1{font-size:26px;margin:0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel{background:#fff;border:1px solid #d9e0ea;border-radius:8px;padding:14px}.game{min-height:360px;position:relative;overflow:hidden;background:#eaf6f1;border:2px solid #22594b;border-radius:8px}.target{position:absolute;width:54px;height:54px;border-radius:50%;border:0;background:#f45b69;color:#fff;font-weight:700;box-shadow:0 4px 10px #0003;cursor:pointer}.target:focus{outline:3px solid #172033}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:#eef2f7;border-radius:6px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}input{width:100%;border:1px solid #b8c2d1;border-radius:6px;padding:10px;font:inherit}button{border:0;border-radius:6px;padding:10px 12px;font-weight:700;cursor:pointer;background:#2457a6;color:#fff}button.secondary{background:#516070}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.message{min-height:22px;color:#415166;font-size:14px;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e1e6ee;padding:8px;text-align:left;font-size:14px}th{background:#f0f3f8}.me{background:#fff7d6}.small{font-size:13px;color:#5b6778}@media(max-width:760px){.grid{grid-template-columns:1fr}header{display:block}.game{min-height:320px}}</style></head><body><main class="wrap"><header><h1>High Score Dash</h1><button class="secondary" id="shareBtn">Share game</button></header><section class="grid"><div class="panel"><label for="name">Player name</label><input id="name" maxlength="30" placeholder="Type your name"><div class="stats"><div class="stat"><span>Score</span><b id="score">0</b></div><div class="stat"><span>Time</span><b id="time">30</b></div><div class="stat"><span>Streak</span><b id="streak">0</b></div></div><div class="game" id="game"><button class="target" id="target" style="display:none">+1</button></div><div class="actions"><button id="startBtn">Start round</button><button id="saveBtn" disabled>Save high score</button><button class="secondary" id="refreshBtn">Refresh scores</button></div><div class="message" id="message"></div></div><div class="panel"><h2 style="font-size:20px;margin:0 0 8px">Leaderboard</h2><div class="small" id="myBest">Your high score: 0</div><table><thead><tr><th>#</th><th>Player</th><th>High score</th><th>Best streak</th></tr></thead><tbody id="board"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main><script>const appId='5de1ae9b-f8d4-4d6d-a3c1-f085bdb30db7';const apiToken='app_8b6d08348ab2015a30dc3f0af3c09f4f616b80406f4eade5';const tableName='scores';const baseUrl='https://easydata.is/apps/'+appId+'/tables/'+tableName+'/rows';const headers={'Content-Type':'application/json','Authorization':'Bearer '+apiToken,'x-api-token':apiToken};const el=id=>document.getElementById(id);const nameInput=el('name'),scoreEl=el('score'),timeEl=el('time'),streakEl=el('streak'),target=el('target'),game=el('game'),board=el('board'),msg=el('message'),myBest=el('myBest');let score=0,time=30,streak=0,bestStreak=0,timer=null,playing=false,rows=[];let deviceId=localStorage.getItem('hsdDeviceId');if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem('hsdDeviceId',deviceId)}nameInput.value=localStorage.getItem('hsdName')||'';function clean(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setMsg(t){msg.textContent=t}function placeTarget(){const r=game.getBoundingClientRect(),s=54;target.style.left=Math.max(0,Math.random()*(r.width-s))+'px';target.style.top=Math.max(0,Math.random()*(r.height-s))+'px'}function renderStats(){scoreEl.textContent=score;timeEl.textContent=time;streakEl.textContent=streak}function player(){return nameInput.value.trim()||'Anonymous'}function getLeaders(){const map=new Map();for(const r of rows){const n=(r.playerName||'Anonymous').trim();const cur=map.get(n);if(!cur||Number(r.score)>cur.score)map.set(n,{playerName:n,score:Number(r.score)||0,bestStreak:Number(r.bestStreak)||0,deviceId:r.deviceId,playedAt:r.playedAt});else if(cur&&Number(r.score)===cur.score)cur.bestStreak=Math.max(cur.bestStreak,Number(r.bestStreak)||0)}return [...map.values()].sort((a,b)=>b.score-a.score||b.bestStreak-a.bestStreak).slice(0,20)}function renderBoard(){const leaders=getLeaders();const p=player();const mine=Math.max(0,...rows.filter(r=>r.deviceId===deviceId||r.playerName===p).map(r=>Number(r.score)||0));myBest.textContent='Your high score: '+mine;board.innerHTML=leaders.map((r,i)=>'<tr class="'+(r.playerName===p?'me':'')+'"><td>'+(i+1)+'</td><td>'+clean(r.playerName)+'</td><td>'+r.score+'</td><td>'+r.bestStreak+'</td></tr>').join('')||'<tr><td colspan="4">No scores yet. Play the first round.</td></tr>'}async function loadScores(){try{const res=await fetch(baseUrl+'?limit=500&order=score:desc',{headers});if(!res.ok)throw new Error('Scores could not load');const data=await res.json();rows=Array.isArray(data)?data:(data.rows||[]);renderBoard();setMsg('Scores are up to date.')}catch(e){setMsg(e.message)}}function start(){localStorage.setItem('hsdName',player());score=0;time=30;streak=0;bestStreak=0;playing=true;el('saveBtn').disabled=true;target.style.display='block';placeTarget();renderStats();setMsg('Click the moving target as many times as you can.');clearInterval(timer);timer=setInterval(()=>{time--;renderStats();if(time<=0)finish()},1000)}function finish(){playing=false;clearInterval(timer);target.style.display='none';el('saveBtn').disabled=false;setMsg('Round finished. Save your score to compare with others.')}async function saveScore(){localStorage.setItem('hsdName',player());const body={playerName:player(),score,bestStreak,playedAt:new Date().toISOString(),deviceId};el('saveBtn').disabled=true;setMsg('Saving score...');try{const res=await fetch(baseUrl,{method:'POST',headers,body:JSON.stringify(body)});if(!res.ok)throw new Error('Score could not be saved');await loadScores();setMsg('Score saved. Everyone can see it on the leaderboard.')}catch(e){el('saveBtn').disabled=false;setMsg(e.message)}}target.addEventListener('click',()=>{if(!playing)return;score++;streak++;bestStreak=Math.max(bestStreak,streak);renderStats();placeTarget()});game.addEventListener('click',e=>{if(playing&&e.target!==target){streak=0;renderStats()}});el('startBtn').addEventListener('click',start);el('saveBtn').addEventListener('click',saveScore);el('refreshBtn').addEventListener('click',loadScores);el('shareBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);setMsg('Game link copied.')}catch(e){setMsg('Share this page link with players.')}});nameInput.addEventListener('change',()=>{localStorage.setItem('hsdName',player());renderBoard()});loadScores();</script></body></html>
