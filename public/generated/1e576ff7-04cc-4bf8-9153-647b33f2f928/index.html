<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude CRUD Test — Students</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f9fafb; }
  h1 { color: #111; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  th { background: #4f46e5; color: #fff; padding: 12px 16px; text-align: left; }
  td { padding: 11px 16px; border-bottom: 1px solid #e5e7eb; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f3f4f6; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 600; }
  .active { background: #d1fae5; color: #065f46; }
  .inactive { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<h1>Students</h1>
<table id="tbl">
  <thead><tr><th>Name</th><th>Grade</th><th>Status</th><th>Notes</th></tr></thead>
  <tbody><tr><td colspan="4">Loading...</td></tr></tbody>
</table>
<script>
fetch("https://easydata.is/apps/1e576ff7-04cc-4bf8-9153-647b33f2f928/tables/students/rows", {
  headers: { "Authorization": "Bearer app_f4f7d0cbe865d110eb7a2d40a993ef9d99ed673f24e9e568" }
})
.then(r => r.json())
.then(data => {
  const rows = data.rows || data;
  document.querySelector("#tbl tbody").innerHTML = rows.length
    ? rows.map(r => `<tr><td>${r.student_name}</td><td>${r.grade}</td><td><span class="badge ${r.status}">${r.status}</span></td><td>${r.notes}</td></tr>`).join("")
    : "<tr><td colspan='4'>No rows found.</td></tr>";
})
.catch(e => { document.querySelector("#tbl tbody").innerHTML = `<tr><td colspan='4'>Error: ${e.message}</td></tr>`; });
</script>
</body>
</html>
