<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Score Dash</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:980px;margin:0 auto}header{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}h1{margin:0;font-size:30px}.panel{background:#fff;border:1px solid #d9deea;border-radius:8px;padding:14px;box-shadow:0 1px 3px #0001}.setup{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;font-weight:700;font-size:14px}input{font:inherit;padding:10px 12px;border:1px solid #b8c0cf;border-radius:6px;min-width:220px}button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:10px 14px;background:#1957d2;color:#fff;cursor:pointer}button.secondary{background:#45546f}button:disabled{background:#9aa4b5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid #d9deea;border-radius:8px;padding:12px;text-align:center}.stat b{display:block;font-size:28px}.game{position:relative;height:420px;border:2px solid #26334d;border-radius:8px;background:linear-gradient(#fbfcff,#edf2fb);overflow:hidden;touch-action:manipulation}.target{position:absolute;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:#e9334f;box-shadow:0 6px 18px #0004;display:none;transform:translate(-50%,-50%)}.target:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#ffd647}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:22px;font-weight:800;color:#26334d;pointer-events:none}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.leader ol{margin:8px 0 0;padding-left:28px}.leader li{padding:7px 0;border-bottom:1px solid #edf0f6}.muted{color:#60708c;font-size:14px}.saveRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}@media(max-width:720px){body{padding:10px}.bottom{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.game{height:360px}h1{font-size:25px}input{min-width:0;width:100%}}</style></head><body><div class="wrap"><header><div><h1>High Score Dash</h1><div class="muted">Click the moving target for 30 seconds.</div></div><button class="secondary" id="refreshBtn">Refresh Leaderboard</button></header><section class="panel setup"><label>Player name<input id="nameInput" maxlength="32" autocomplete="name" placeholder="Type your name"></label><button id="startBtn">Start 30 Second Game</button></section><section class="stats"><div class="stat"><span>Score</span><b id="scoreOut">0</b></div><div class="stat"><span>Time</span><b id="timeOut">30</b></div><div class="stat"><span>Streak</span><b id="streakOut">0</b></div></section><main class="game" id="game"><div class="message" id="message">Enter your name, then start.</div><button class="target" id="target" aria-label="Click target"></button></main><div class="bottom"><section class="panel"><h2>Save Score</h2><div id="resultText" class="muted">Finish a game to save your score.</div><div class="saveRow"><button id="saveBtn" disabled>Save High Score</button><span id="saveStatus" class="muted"></span></div></section><section class="panel leader"><h2>Leaderboard</h2><ol id="leaderboard"><li class="muted">Loading...</li></ol></section></div></div><script>const APP_ID='b22f1b72-c71b-45a6-89ea-1497d66cdf38';const API_TOKEN='app_9d560786c54fa7d9a109033bc24af1d5ff1b051eb076784e';const API='https://easydata.is/apps/'+APP_ID+'/tables/scores/rows';const $=id=>document.getElementById(id);const game=$('game'),target=$('target'),msg=$('message');let score=0,streak=0,bestStreak=0,timeLeft=30,running=false,timer=null,lastSavedKey='';let deviceId=localStorage.getItem('hsdDeviceId');if(!deviceId){deviceId='device-'+crypto.randomUUID();localStorage.setItem('hsdDeviceId',deviceId)}function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN,'X-API-Token':API_TOKEN}}function cleanName(){return $('nameInput').value.trim().replace(/\s+/g,' ').slice(0,32)}function updateStats(){$('scoreOut').textContent=score;$('timeOut').textContent=timeLeft;$('streakOut').textContent=streak}function moveTarget(){const r=game.getBoundingClientRect();const pad=42;const x=pad+Math.random()*Math.max(1,r.width-pad*2);const y=pad+Math.random()*Math.max(1,r.height-pad*2);target.style.left=x+'px';target.style.top=y+'px'}function startGame(){const name=cleanName();if(!name){$('nameInput').focus();msg.textContent='Type your name first.';return}score=0;streak=0;bestStreak=0;timeLeft=30;running=true;lastSavedKey='';$('saveBtn').disabled=true;$('saveStatus').textContent='';$('resultText').textContent='Game in progress.';msg.textContent='';msg.style.display='none';target.style.display='block';updateStats();moveTarget();clearInterval(timer);timer=setInterval(()=>{timeLeft--;updateStats();if(timeLeft<=0)endGame()},1000)}function endGame(){running=false;clearInterval(timer);target.style.display='none';msg.style.display='flex';msg.textContent='Time! Score: '+score+' | Best streak: '+bestStreak;$('resultText').textContent='Ready to save '+cleanName()+': '+score+' points, best streak '+bestStreak+'.';$('saveBtn').disabled=false}target.addEventListener('click',e=>{e.stopPropagation();if(!running)return;score++;streak++;bestStreak=Math.max(bestStreak,streak);updateStats();moveTarget()});game.addEventListener('click',()=>{if(running){streak=0;updateStats()}});$('startBtn').addEventListener('click',startGame);$('saveBtn').addEventListener('click',async()=>{const name=cleanName();if(!name||running||timeLeft>0)return;const key=name+'|'+score+'|'+bestStreak;if(key===lastSavedKey)return;$('saveBtn').disabled=true;$('saveStatus').textContent='Saving...';try{const body={playerName:name,score:score,bestStreak:bestStreak,playedAt:new Date().toISOString(),deviceId:deviceId};const res=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!res.ok)throw new Error('Save failed');lastSavedKey=key;$('saveStatus').textContent='Saved.';await loadLeaderboard()}catch(err){$('saveStatus').textContent='Could not save. Try again.';$('saveBtn').disabled=false}});function rowsFrom(data){if(Array.isArray(data))return data;if(Array.isArray(data.rows))return data.rows;if(Array.isArray(data.data))return data.data;return []}async function loadLeaderboard(){const list=$('leaderboard');list.innerHTML='<li class="muted">Loading...</li>';try{const res=await fetch(API+'?order=score:desc&limit=50',{headers:headers()});if(!res.ok)throw new Error('Load failed');const rows=rowsFrom(await res.json()).sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)||String(a.playedAt||'').localeCompare(String(b.playedAt||''))).slice(0,20);if(!rows.length){list.innerHTML='<li class="muted">No scores yet.</li>';return}list.innerHTML='';rows.forEach(row=>{const li=document.createElement('li');const date=row.playedAt?new Date(row.playedAt).toLocaleString():'';li.textContent=(row.playerName||'Player')+' - '+(Number(row.score)||0)+' points, streak '+(Number(row.bestStreak)||0)+(date?' - '+date:'');list.appendChild(li)})}catch(err){list.innerHTML='<li class="muted">Leaderboard unavailable.</li>'}}$('refreshBtn').addEventListener('click',loadLeaderboard);updateStats();loadLeaderboard();</script></body></html>
