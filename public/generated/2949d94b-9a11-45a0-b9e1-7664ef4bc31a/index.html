<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; padding: 32px 16px; }
  h1 { font-size: 2rem; font-weight: 700; margin-bottom: 28px; color: #0f172a; letter-spacing: -0.5px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 28px; }
  .card h2 { font-size: 1rem; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:560px){ .form-grid { grid-template-columns: 1fr; } }
  .form-grid .full { grid-column: 1 / -1; }
  input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 0.95rem; background: #f8fafc; transition: border-color .15s; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #6366f1; background: #fff; }
  textarea { resize: vertical; min-height: 68px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 7px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-sm { padding: 5px 11px; font-size: 0.8rem; font-weight: 600; border-radius: 5px; border: none; cursor: pointer; }
  .btn-edit { background: #e0e7ff; color: #4338ca; }
  .btn-edit:hover { background: #c7d2fe; }
  .btn-delete { background: #fee2e2; color: #b91c1c; }
  .btn-delete:hover { background: #fecaca; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  thead th { background: #f8fafc; padding: 11px 14px; text-align: left; font-weight: 600; color: #64748b; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  tbody td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8fafc; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; text-transform: capitalize; white-space: nowrap; }
  .badge-open { background: #dbeafe; color: #1d4ed8; }
  .badge-inprogress { background: #fef9c3; color: #854d0e; }
  .badge-done { background: #dcfce7; color: #166534; }
  .badge-default { background: #f1f5f9; color: #475569; }
  .actions { display: flex; gap: 6px; }
  .empty { text-align: center; color: #94a3b8; padding: 28px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999; }
  .toast.show { opacity: 1; }
  /* modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal h2 { margin-bottom: 18px; font-size: 1.1rem; color: #0f172a; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn-cancel { background: #f1f5f9; color: #475569; }
  .btn-cancel:hover { background: #e2e8f0; }
</style>
</head>
<body>

<h1>📋 My Tasks</h1>

<!-- Add Task Form -->
<div class="card">
  <h2>Add New Task</h2>
  <div class="form-grid">
    <input id="f-title" placeholder="Task title" />
    <select id="f-status">
      <option value="open">Open</option>
      <option value="in progress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <div class="full"><textarea id="f-desc" placeholder="Description (optional)"></textarea></div>
    <div class="full"><button class="btn btn-primary" onclick="addTask()">＋ Add Task</button></div>
  </div>
</div>

<!-- Tasks Table -->
<div class="card">
  <h2>All Tasks</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Description</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tasks-body">
        <tr><td colspan="6" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="overlay" id="edit-overlay">
  <div class="modal">
    <h2>Edit Task</h2>
    <div class="form-grid">
      <input id="e-title" placeholder="Task title" />
      <select id="e-status">
        <option value="open">Open</option>
        <option value="in progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <div class="full"><textarea id="e-desc" placeholder="Description"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APP_ID   = "2949d94b-9a11-45a0-b9e1-7664ef4bc31a";
const TOKEN    = "app_9e0f6948f5d7623cd610af079d61c71405a649a05f23296a";
const BASE     = `https://easydata.is/apps/${APP_ID}/tables/tasks`;
const HEADERS  = { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" };

let editingId = null;

function badge(status) {
  const map = { open: "badge-open", "in progress": "badge-inprogress", done: "badge-done" };
  return `<span class="badge ${map[status] || 'badge-default'}">${status}</span>`;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function loadTasks() {
  const tbody = document.getElementById("tasks-body");
  try {
    const r = await fetch(`${BASE}/rows`, { headers: HEADERS });
    const data = await r.json();
    const rows = data.rows || data;
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6" class="empty">No tasks yet. Add one above!</td></tr>`; return; }
    tbody.innerHTML = rows.map((t, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${esc(t.task_title)}</strong></td>
        <td style="color:#475569">${esc(t.description || "—")}</td>
        <td>${badge(t.status)}</td>
        <td style="white-space:nowrap;color:#64748b">${esc(t.created_at || "")}</td>
        <td><div class="actions">
          <button class="btn-sm btn-edit" onclick="openEdit(${t.id},'${esc(t.task_title)}','${esc(t.description||"")}','${esc(t.status)}')">✏️ Edit</button>
          <button class="btn-sm btn-delete" onclick="deleteTask(${t.id})">🗑️ Delete</button>
        </div></td>
      </tr>`).join("");
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Error loading tasks: ${e.message}</td></tr>`;
  }
}

function esc(s) { return String(s).replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function addTask() {
  const title = document.getElementById("f-title").value.trim();
  if (!title) { toast("Please enter a task title."); return; }
  const body = {
    task_title: title,
    description: document.getElementById("f-desc").value.trim(),
    status: document.getElementById("f-status").value,
    created_at: new Date().toISOString().slice(0, 10)
  };
  await fetch(`${BASE}/rows`, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
  document.getElementById("f-title").value = "";
  document.getElementById("f-desc").value = "";
  document.getElementById("f-status").value = "open";
  toast("Task added ✓");
  loadTasks();
}

function openEdit(id, title, desc, status) {
  editingId = id;
  document.getElementById("e-title").value = title;
  document.getElementById("e-desc").value = desc;
  document.getElementById("e-status").value = status;
  document.getElementById("edit-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("edit-overlay").classList.remove("open");
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const body = {
    task_title: document.getElementById("e-title").value.trim(),
    description: document.getElementById("e-desc").value.trim(),
    status: document.getElementById("e-status").value
  };
  await fetch(`${BASE}/rows/${editingId}`, { method: "PATCH", headers: HEADERS, body: JSON.stringify(body) });
  closeModal();
  toast("Task updated ✓");
  loadTasks();
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) return;
  await fetch(`${BASE}/rows/${id}`, { method: "DELETE", headers: HEADERS });
  toast("Task deleted ✓");
  loadTasks();
}

document.getElementById("edit-overlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

loadTasks();
</script>
</body>
</html>
