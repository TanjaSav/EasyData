<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Project Submissions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex flex-col gap-2 border-b border-slate-200 pb-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-950">Student Project Submissions</h1>
        <p class="mt-1 text-sm text-slate-600">Students submit their project details and photo. Teachers can review every submission below.</p>
      </div>
      <button id="refreshBtn" type="button" class="inline-flex items-center justify-center rounded-md bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-slate-300 hover:bg-slate-100">Refresh</button>
    </header>

    <div class="grid gap-6 lg:grid-cols-[380px_1fr]">
      <section class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <h2 class="text-lg font-semibold text-slate-950">New submission</h2>
        <form id="submissionForm" class="mt-4 space-y-4">
          <div>
            <label for="studentName" class="block text-sm font-medium text-slate-700">Student name</label>
            <input id="studentName" name="studentName" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" autocomplete="name">
          </div>
          <div>
            <label for="projectTitle" class="block text-sm font-medium text-slate-700">Project title</label>
            <input id="projectTitle" name="projectTitle" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
          </div>
          <div>
            <label for="notes" class="block text-sm font-medium text-slate-700">Notes</label>
            <textarea id="notes" name="notes" rows="4" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea>
          </div>
          <div>
            <label for="photo" class="block text-sm font-medium text-slate-700">Photo</label>
            <input id="photo" name="photo" type="file" accept="image/*" required class="mt-1 block w-full text-sm text-slate-700 file:mr-3 file:rounded-md file:border-0 file:bg-blue-50 file:px-3 file:py-2 file:text-sm file:font-medium file:text-blue-700 hover:file:bg-blue-100">
            <img id="preview" alt="Selected project preview" class="mt-3 hidden max-h-48 w-full rounded-md object-cover ring-1 ring-slate-200">
          </div>
          <p id="formMessage" class="min-h-5 text-sm"></p>
          <button id="submitBtn" type="submit" class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-400">Submit project</button>
        </form>
      </section>

      <section class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h2 class="text-lg font-semibold text-slate-950">Teacher view</h2>
            <p id="countText" class="text-sm text-slate-600">Loading submissions...</p>
          </div>
        </div>
        <div id="emptyState" class="mt-6 hidden rounded-md border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500">No submissions yet.</div>
        <div id="submissions" class="mt-5 grid gap-4 sm:grid-cols-2"></div>
      </section>
    </div>
  </main>

  <script>
    const appId = "6ae2001b-0ac7-49c3-8883-149b219c11dc";
    const apiToken = "app_9f99c1f6fde10a0cc8d1fb26adbaac9e4a3ef9f64d76dc92";
    const tableName = "submissions";
    const rowsUrl = "/apps/" + appId + "/tables/" + tableName + "/rows";
    const authHeaders = { "Authorization": "Bearer " + apiToken };

    const form = document.getElementById("submissionForm");
    const submitBtn = document.getElementById("submitBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const message = document.getElementById("formMessage");
    const preview = document.getElementById("preview");
    const photoInput = document.getElementById("photo");
    const submissionsEl = document.getElementById("submissions");
    const emptyState = document.getElementById("emptyState");
    const countText = document.getElementById("countText");

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function readPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read the photo."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Please choose a valid image file."));
          img.onload = () => {
            const maxSide = 900;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function normalizeRows(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.rows)) return data.rows;
      return [];
    }

    async function loadRows() {
      countText.textContent = "Loading submissions...";
      const response = await fetch(rowsUrl, { headers: authHeaders });
      if (!response.ok) throw new Error("Could not load submissions.");
      const rows = normalizeRows(await response.json()).sort((a, b) => String(b.submittedAt || "").localeCompare(String(a.submittedAt || "")));
      submissionsEl.innerHTML = rows.map(row => `
        <article class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
          ${row.photo ? `<img src="${row.photo}" alt="Project photo for ${escapeHtml(row.projectTitle)}" class="h-48 w-full object-cover">` : `<div class="flex h-48 items-center justify-center bg-slate-100 text-sm text-slate-500">No photo</div>`}
          <div class="space-y-3 p-4">
            <div>
              <h3 class="text-base font-semibold text-slate-950">${escapeHtml(row.projectTitle)}</h3>
              <p class="text-sm text-slate-600">${escapeHtml(row.studentName)}</p>
            </div>
            ${row.notes ? `<p class="whitespace-pre-wrap text-sm text-slate-700">${escapeHtml(row.notes)}</p>` : ""}
            <p class="text-xs text-slate-500">Submitted ${row.submittedAt ? new Date(row.submittedAt).toLocaleString() : ""}</p>
          </div>
        </article>
      `).join("");
      emptyState.classList.toggle("hidden", rows.length !== 0);
      countText.textContent = rows.length + (rows.length === 1 ? " submission" : " submissions");
    }

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) {
        preview.classList.add("hidden");
        preview.removeAttribute("src");
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.classList.remove("hidden");
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "Submitting...";
      message.className = "min-h-5 text-sm text-slate-600";
      submitBtn.disabled = true;
      try {
        const file = photoInput.files[0];
        const photo = file ? await readPhoto(file) : "";
        const payload = {
          studentName: form.studentName.value.trim(),
          projectTitle: form.projectTitle.value.trim(),
          notes: form.notes.value.trim(),
          photo,
          submittedAt: new Date().toISOString()
        };
        const response = await fetch(rowsUrl, {
          method: "POST",
          headers: { ...authHeaders, "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error("Submission failed.");
        form.reset();
        preview.classList.add("hidden");
        preview.removeAttribute("src");
        message.textContent = "Submitted. Thank you.";
        message.className = "min-h-5 text-sm text-green-700";
        await loadRows();
      } catch (error) {
        message.textContent = error.message || "Something went wrong.";
        message.className = "min-h-5 text-sm text-red-700";
      } finally {
        submitBtn.disabled = false;
      }
    });

    refreshBtn.addEventListener("click", () => loadRows().catch(error => {
      countText.textContent = error.message || "Could not refresh submissions.";
    }));

    loadRows().catch(error => {
      countText.textContent = error.message || "Could not load submissions.";
    });
  </script>
</body>
</html>
