<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-950">Class Notes</h1>
      <p class="mt-2 max-w-2xl text-slate-600">Record quick notes about student progress, participation, and classroom observations in one simple place.</p>
    </header>

    <section class="grid gap-6 lg:grid-cols-[360px_1fr]">
      <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-semibold text-slate-950">Add a note</h2>
        <form id="noteForm" class="mt-4 space-y-4">
          <div>
            <label for="student_name" class="block text-sm font-medium text-slate-700">Student name</label>
            <input id="student_name" name="student_name" type="text" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label for="subject" class="block text-sm font-medium text-slate-700">Subject</label>
            <input id="subject" name="subject" type="text" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label for="note_text" class="block text-sm font-medium text-slate-700">Note</label>
            <textarea id="note_text" name="note_text" rows="5" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"></textarea>
          </div>
          <button id="submitButton" type="submit" class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Save note</button>
          <p id="formMessage" class="hidden rounded-md px-3 py-2 text-sm"></p>
        </form>
      </div>

      <div class="rounded-lg border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
          <h2 class="text-lg font-semibold text-slate-950">Submitted notes</h2>
          <button id="refreshButton" type="button" class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Refresh</button>
        </div>
        <div id="loading" class="px-5 py-6 text-sm text-slate-500">Loading notes...</div>
        <div id="emptyState" class="hidden px-5 py-6 text-sm text-slate-500">No notes yet.</div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Student</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Subject</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Note</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Created</th>
              </tr>
            </thead>
            <tbody id="notesBody" class="divide-y divide-slate-100 bg-white"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const appId = '8af6d877-6b31-4090-bfe4-496ef169acd6';
    const apiToken = 'app_816db7750a8c4096289aa272e2fa6f747b85ed8e8be36569';
    const tableName = 'notes';
    const rowsUrl = `https://easydata.is/apps/${appId}/tables/${tableName}/rows`;

    const form = document.getElementById('noteForm');
    const formMessage = document.getElementById('formMessage');
    const submitButton = document.getElementById('submitButton');
    const refreshButton = document.getElementById('refreshButton');
    const loading = document.getElementById('loading');
    const emptyState = document.getElementById('emptyState');
    const notesBody = document.getElementById('notesBody');

    function headers() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiToken}`,
        'x-api-token': apiToken
      };
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = type === 'error'
        ? 'rounded-md bg-red-50 px-3 py-2 text-sm text-red-700'
        : 'rounded-md bg-green-50 px-3 py-2 text-sm text-green-700';
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function renderRows(rows) {
      notesBody.innerHTML = '';
      emptyState.classList.toggle('hidden', rows.length > 0);

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        tr.className = 'align-top';
        tr.innerHTML = `
          <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-slate-900"></td>
          <td class="whitespace-nowrap px-4 py-3 text-sm text-slate-700"></td>
          <td class="min-w-64 px-4 py-3 text-sm text-slate-700"></td>
          <td class="whitespace-nowrap px-4 py-3 text-sm text-slate-500"></td>
        `;
        tr.children[0].textContent = row.student_name || '';
        tr.children[1].textContent = row.subject || '';
        tr.children[2].textContent = row.note_text || '';
        tr.children[3].textContent = formatDate(row.created_at);
        notesBody.appendChild(tr);
      });
    }

    async function loadNotes() {
      loading.classList.remove('hidden');
      emptyState.classList.add('hidden');
      try {
        const response = await fetch(`${rowsUrl}?order=created_at:desc`, { headers: headers() });
        if (!response.ok) throw new Error('Could not load notes.');
        const data = await response.json();
        renderRows(data.rows || []);
      } catch (error) {
        notesBody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-sm text-red-700">${error.message}</td></tr>`;
      } finally {
        loading.classList.add('hidden');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = 'Saving...';
      formMessage.className = 'hidden';

      const formData = new FormData(form);
      const note = {
        student_name: formData.get('student_name').trim(),
        subject: formData.get('subject').trim(),
        note_text: formData.get('note_text').trim(),
        created_at: new Date().toISOString()
      };

      try {
        const response = await fetch(rowsUrl, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify(note)
        });
        if (!response.ok) throw new Error('Could not save the note.');
        form.reset();
        showMessage('Note saved.', 'success');
        await loadNotes();
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Save note';
      }
    });

    refreshButton.addEventListener('click', loadNotes);
    loadNotes();
  </script>
</body>
</html>
