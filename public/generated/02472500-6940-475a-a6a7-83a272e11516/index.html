<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Watchlist</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #d8dee9;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --danger: #dc2626;
      --danger-dark: #991b1b;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e0e7ff 0, transparent 34%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .count-pill {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 222, 233, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .form-card { padding: 22px; position: sticky; top: 20px; }
    .table-card { overflow: hidden; }

    h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    label {
      display: block;
      color: #344054;
      font-weight: 650;
      font-size: 0.9rem;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .field { margin-bottom: 15px; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      padding: 11px 14px;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.58; transform: none; }

    .primary { background: var(--primary); color: #fff; flex: 1; }
    .primary:hover { background: var(--primary-dark); }

    .secondary { background: #eef2ff; color: var(--primary-dark); }
    .secondary.hidden { display: none; }

    .icon-btn {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      background: #f2f4f7;
      color: #344054;
    }

    .icon-btn.edit:hover { background: #e0e7ff; color: var(--primary-dark); }
    .icon-btn.delete { background: #fee2e2; color: var(--danger); }
    .icon-btn.delete:hover { background: #fecaca; color: var(--danger-dark); }

    .status-bar {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th, td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid #eef0f5;
      vertical-align: middle;
    }

    th {
      color: #475467;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #f8fafc;
    }

    tbody tr:hover { background: #fafbff; }
    tbody tr:last-child td { border-bottom: 0; }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #067647;
      font-size: 0.85rem;
      font-weight: 750;
    }

    .badge.pending { background: #fff7ed; color: #c2410c; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
    }

    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; }
      .form-card { position: static; }
      .hero { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 1120px); padding: 24px 0; }
      .form-card { padding: 18px; }
      th, td { padding: 13px 12px; }
      .actions { flex-direction: column; }
      .secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>Movie Watchlist</h1>
        <p class="subtitle">Add, edit, delete, and track every movie in one clean table.</p>
      </div>
      <div class="count-pill" id="movieCount">Loading movies…</div>
    </header>

    <section class="grid">
      <form class="card form-card" id="movieForm">
        <h2 id="formTitle">Add a movie</h2>

        <div class="field">
          <label for="movie_title">Movie title</label>
          <input id="movie_title" name="movie_title" type="text" placeholder="e.g., Arrival" required />
        </div>

        <div class="field">
          <label for="genre">Genre</label>
          <input id="genre" name="genre" type="text" placeholder="e.g., Drama" required />
        </div>

        <div class="field">
          <label for="rating">Rating</label>
          <input id="rating" name="rating" type="number" min="1" max="10" placeholder="1-10" required />
        </div>

        <div class="field">
          <label for="watch_status">Watch status</label>
          <select id="watch_status" name="watch_status" required>
            <option value="Want to Watch">Want to Watch</option>
            <option value="Watching">Watching</option>
            <option value="Watched">Watched</option>
          </select>
        </div>

        <div class="actions">
          <button class="primary" type="submit" id="submitBtn">Add movie</button>
          <button class="secondary hidden" type="button" id="cancelBtn">Cancel edit</button>
        </div>

        <div class="status-bar" id="statusMessage"></div>
      </form>

      <section class="card table-card" aria-label="Movie table">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="movieRows">
              <tr><td colspan="5" class="empty">Loading movies…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const APP_ID = '02472500-6940-475a-a6a7-83a272e11516';
    const API_TOKEN = 'app_bce8ac1f9efe48c68b170d586dde8a2ab9946be6cac2a21e';
    const TABLE_NAME = 'movies';

    const form = document.getElementById('movieForm');
    const rowsEl = document.getElementById('movieRows');
    const statusEl = document.getElementById('statusMessage');
    const countEl = document.getElementById('movieCount');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    let movies = [];
    let editingId = null;

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${API_TOKEN}`,
      'X-API-Token': API_TOKEN
    };

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#dc2626' : '#667085';
    }

    function getMovieId(movie) {
      return String(movie.id ?? movie.rowId ?? movie._id ?? '');
    }

    function normalizeRows(payload) {
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.data || payload.items || []);
      return raw.map(item => {
        const data = item.data && typeof item.data === 'object' ? item.data : item;
        return {
          id: item.id ?? item.rowId ?? item._id ?? data.id,
          movie_title: data.movie_title ?? '',
          genre: data.genre ?? '',
          rating: Number(data.rating ?? 0),
          watch_status: data.watch_status ?? ''
        };
      });
    }

    async function requestWithFallback(configs) {
      let lastError;
      for (const config of configs) {
        try {
          const response = await fetch(config.url, {
            method: config.method || 'GET',
            headers,
            body: config.body ? JSON.stringify(config.body) : undefined
          });

          const text = await response.text();
          let payload = { success: true };
          if (text) {
            try {
              payload = JSON.parse(text);
            } catch {
              payload = { error: text.startsWith('<') ? 'Request returned HTML from ' + config.url : text };
            }
          }

          if (!response.ok) {
            lastError = new Error(payload.error || payload.message || `Request failed with ${response.status}`);
            if ([400, 404, 405].includes(response.status)) continue;
            throw lastError;
          }

          return payload;
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('EasyData API request failed.');
    }

    const endpoints = {
      list: () => [
        { url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows?order=id:asc` },
        { url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows?order=id:asc` }
      ],
      create: (data) => [
        { method: 'POST', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows`, body: data },
        { method: 'POST', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows`, body: data }
      ],
      update: (id, data) => [
        { method: 'PUT', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows/${id}`, body: data },
        { method: 'PUT', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows/${id}`, body: data }
      ],
      remove: (id) => [
        { method: 'DELETE', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows/${id}` },
        { method: 'DELETE', url: `/apps/${APP_ID}/tables/${TABLE_NAME}/rows/${id}` }
      ]
    };

    async function loadMovies() {
      setStatus('Loading movies…');
      try {
        const payload = await requestWithFallback(endpoints.list());
        movies = normalizeRows(payload);
        renderMovies();
        setStatus('');
      } catch (error) {
        rowsEl.innerHTML = `<tr><td colspan="5" class="empty">Could not load movies. ${escapeHtml(error.message)}</td></tr>`;
        countEl.textContent = 'Unable to load movies';
        setStatus(error.message, true);
      }
    }

    function renderMovies() {
      countEl.textContent = `${movies.length} movie${movies.length === 1 ? '' : 's'}`;

      if (!movies.length) {
        rowsEl.innerHTML = '<tr><td colspan="5" class="empty">No movies yet. Add your first movie with the form.</td></tr>';
        return;
      }

      rowsEl.innerHTML = movies.map(movie => {
        const id = getMovieId(movie);
        const statusClass = movie.watch_status === 'Watched' ? '' : 'pending';
        return `
          <tr>
            <td><strong>${escapeHtml(movie.movie_title)}</strong></td>
            <td>${escapeHtml(movie.genre)}</td>
            <td><span class="rating">★ ${escapeHtml(String(movie.rating))}/10</span></td>
            <td><span class="badge ${statusClass}">${escapeHtml(movie.watch_status)}</span></td>
            <td>
              <div class="row-actions">
                <button class="icon-btn edit" type="button" onclick="startEdit('${id}')">Edit</button>
                <button class="icon-btn delete" type="button" onclick="deleteMovie('${id}')">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function getFormData() {
      return {
        movie_title: document.getElementById('movie_title').value.trim(),
        genre: document.getElementById('genre').value.trim(),
        rating: Number(document.getElementById('rating').value),
        watch_status: document.getElementById('watch_status').value
      };
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById('watch_status').value = 'Want to Watch';
      formTitle.textContent = 'Add a movie';
      submitBtn.textContent = 'Add movie';
      cancelBtn.classList.add('hidden');
      setStatus('');
    }

    window.startEdit = function(id) {
      const movie = movies.find(item => getMovieId(item) === String(id));
      if (!movie) return;

      editingId = id;
      document.getElementById('movie_title').value = movie.movie_title;
      document.getElementById('genre').value = movie.genre;
      document.getElementById('rating').value = movie.rating;
      document.getElementById('watch_status').value = movie.watch_status || 'Want to Watch';
      formTitle.textContent = 'Edit movie';
      submitBtn.textContent = 'Save changes';
      cancelBtn.classList.remove('hidden');
      setStatus(`Editing “${movie.movie_title}”.`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteMovie = async function(id) {
      const movie = movies.find(item => getMovieId(item) === String(id));
      if (!movie || !confirm(`Delete “${movie.movie_title}”?`)) return;

      setStatus('Deleting movie…');
      try {
        await requestWithFallback(endpoints.remove(id));
        if (editingId === id) resetForm();
        await loadMovies();
        setStatus('Movie deleted.');
      } catch (error) {
        setStatus(error.message, true);
      }
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = getFormData();

      if (!data.movie_title || !data.genre || !data.rating || !data.watch_status) {
        setStatus('Please complete all fields.', true);
        return;
      }

      submitBtn.disabled = true;
      setStatus(editingId ? 'Saving changes…' : 'Adding movie…');

      try {
        if (editingId) {
          await requestWithFallback(endpoints.update(editingId, data));
          setStatus('Movie updated.');
        } else {
          await requestWithFallback(endpoints.create(data));
          setStatus('Movie added.');
        }
        resetForm();
        await loadMovies();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener('click', resetForm);

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    loadMovies();
  </script>
</body>
</html>
